# База шуток Гослинга: заготовки, которые он обыгрывает своими словами под момент (не цитирует дословно каждый раз).
# Подбор — по меткам: чем больше меток совпало с обстановкой, тем выше шутка в списке; сказанную он долго не
# повторяет (память по сейву). Не смешно или не к месту — просто удали строку.
#
# Поля:
#   id   — короткое имя (не меняй: по нему помним, что уже сказано)
#   text — заготовка: цитата из игры (местная поговорка — «все в тавернах повторяют») или суть шутки
#   src  — откуда: «игра: кто говорит (плагин номер INFO)» — tools/extract_quotes.py; «мем» — известный мем
#          Скайрима, которого нет в репликах игры дословно; «своя» — придумано для Гослинга
#   tags — когда к месту. Словарь меток (то, что сервис видит в игре):
#     место:   город, деревня, таверна, лавка, храм, замок, тюрьма, склеп драугров, двемерские руины, пещера,
#              подземелье, шахта, лагерь великанов, логово дракона, дикие земли, дорога, горы, берег
#     город:   Вайтран, Рифтен, Солитьюд, Виндхельм, Маркарт, Винтерхолд, Данстар, Фолкрит, Морфал, Ривервуд,
#              Хелген, Высокий Хротгар
#     рядом:   стража, каджиты, великан, дракон, драугры, фалмеры, пауки, грязевой краб, хускарл, нищий,
#              Назим, Хеймскр, Белетор, Алик'р
#     событие: бой, ранение, гибель, загрузка, добыча, сундук, кража, взлом, крик, магия, зелья, перегруз,
#              торговля, оружие, броня, лук, двуручник, два оружия, камень душ, задание, тишина, еда, выпивка
#     время:   ночь, снег, холод, дождь
#     Владос:  вор, Соратник, маг, оборотень, вампир, Довакин, Тёмное Братство, Братья Бури, Легион
#   new  — true: добавлено автоматически, ещё не просмотрено (пока таких нет)

jokes:
  # ---------------------------------------------------------------- стража
  - {id: arrow-knee, text: "Когда-то и меня вела дорога приключений... А потом мне прострелили колено...", src: "игра: стражник (Skyrim 020954)", tags: [стража, город, ранение, лук]}
  - {id: sweetroll, text: "Дай-ка угадаю - кто-то украл твой сладкий рулет...", src: "игра: стражник (Skyrim 02BE10)", tags: [стража, кража, задание, еда]}
  - {id: iron-sword, text: "Серьезно, железный меч? Кого ты убиваешь, бабочек?", src: "игра: стражник (Skyrim 0AD7E3)", tags: [оружие, добыча, бой]}
  - {id: brew-ale, text: "Эй, так ты умеешь варить зелья, да? Может, сваришь мне пивка?", src: "игра: стражник (Skyrim 0D5EB9)", tags: [зелья, выпивка, таверна]}
  - {id: warm-bed-spell, text: "Приветствую знатока магии. Наколдуй мне теплую кровать, а?", src: "игра: стражник (Skyrim 0D5EC4)", tags: [магия, маг, холод, ночь, снег]}
  - {id: two-spells-clap, text: "Так ты знаешь пару заклинаний? Мне что, в ладоши похлопать или в обморок грохнуться?", src: "игра: стражник (Skyrim 0D5EB6)", tags: [магия, маг]}
  - {id: bad-breath, text: "Фу, у тебя изо рта несет. Что это ты жрешь?", src: "игра: стражник (Skyrim 0DD095)", tags: [еда, таверна, выпивка]}
  - {id: wet-dog, text: "Ты раны-то перевязываешь? Воняешь, как мокрая собака.", src: "игра: стражник (Skyrim 0DD09C)", tags: [ранение, оборотень, дождь]}
  - {id: fur-ears, text: "Это что... мех? У тебя из ушей торчит?", src: "игра: стражник (Skyrim 0DD0E1)", tags: [оборотень, Соратник]}
  - {id: maybe-dragonborn, text: "А вообще говоря, может, это я Довакин, только я этого еще не знаю.", src: "игра: стражник (Skyrim 0DD0BB)", tags: [Довакин, крик, дракон, стража]}
  - {id: dragonsreach-name, text: "Дракон здесь. В Драконьем Пределе. А мне-то казалось, это просто название.", src: "игра: стражник (Skyrim 0DD06E)", tags: [Вайтран, замок, дракон]}
  - {id: curved-swords, text: "Видишь тех воинов из Хаммерфелла? У них кривые мечи. Кривые. Мечи.", src: "игра: стражник (Skyrim 0DD0DB)", tags: [Вайтран, Алик'р, стража, оружие]}
  - {id: stomach-ache, text: "Меня тоже могло занести в это убежище... Только у меня в этот день... живот болел.", src: "игра: стражник (Skyrim 0DD0C1)", tags: [Тёмное Братство, бой, подземелье]}
  - {id: sell-mother, text: "На тебе броня из... драконьей кости? Во имя богов, да я мать родную продам за такую.", src: "игра: стражник (Skyrim 0D5E96)", tags: [броня, добыча, дракон]}
  - {id: toothpick, text: "С такой зубочисткой далеко не уедешь. Тебе бы к оружейнику заглянуть.", src: "игра: стражник (Skyrim 0D5EAD)", tags: [оружие, бой, лавка]}
  - {id: huge-sword, text: "Такой огромный меч и в руках-то удержать сложно. Неужто ты им сражаться можешь?", src: "игра: стражник (Skyrim 0D5EB1)", tags: [двуручник, оружие, бой]}
  - {id: hammer-houses, text: "Что ты собираешься делать этим молотом? Дома, что ли, сносить?", src: "игра: стражник (Skyrim 0C7F65)", tags: [двуручник, оружие]}
  - {id: junk-pile, text: "Во имя Шора, ты таскаешь на себе кучу хлама. Сходи да продай это все.", src: "игра: стражник Маркарта (Skyrim 0DA640)", tags: [перегруз, торговля, лавка, добыча]}
  - {id: thief-or-vampire, text: "В темноте шастают только взломщики, либо вампиры. Ты из которых?", src: "игра: стражник (Skyrim 0E0FAF)", tags: [ночь, город, вор, вампир, взлом]}
  - {id: windhelm-jokers, text: "Знаешь, как мы зовем тех, кто шутит со стражей Виндхельма? Самоубийцы.", src: "игра: стражник Виндхельма (Skyrim 0D2AF3)", tags: [Виндхельм, стража]}
  - {id: stone-beds, text: "Не могу поверить, что меня назначили сюда. Тут даже кровати - и те из камня.", src: "игра: стражник Маркарта (Skyrim 036A35)", tags: [Маркарт, таверна, ночь]}
  - {id: riften-rifton, text: "Так все же Рифтен или Рифтон? Это место столько раз переназывали, что я уж и не упомню.", src: "игра: стражник Рифтена (Skyrim 0E156A)", tags: [Рифтен, город]}
  - {id: new-gnisis, text: "Данмеры выпивают в клубе Новый Гнисис. Клуб какой-то придумали... Нет чтобы просто таверной назвать.", src: "игра: стражник Виндхельма (Skyrim 0DA666)", tags: [Виндхельм, таверна, выпивка]}
  - {id: need-a-drink, text: "Дай угадаю - тебе надо выпить.", src: "игра: стражник Маркарта (Skyrim 0DA641)", tags: [таверна, выпивка, гибель, ранение]}
  - {id: psijic-skooma, text: "Один стражник клялся, что видел монаха-псиджика. По-моему, парень пристрастился к скуме.", src: "игра: стражник (Skyrim 0DD0D6)", tags: [магия, Винтерхолд, маг]}
  - {id: hand-in-pocket, text: "Найду твою руку у себя в кармане - отрублю.", src: "игра: стражник (Skyrim 0D5EBB)", tags: [кража, вор, стража]}
  - {id: restless-dead, text: "Одна беда с этими старыми склепами - вечно покойники не хотят лежать смирно.", src: "игра: стражник (Skyrim 0DA63C)", tags: [склеп драугров, драугры, подземелье]}
  - {id: cousin-dragons, text: "Мой кузен борется с драконами, а мне что досталось? Караульная служба.", src: "игра: стражник (Skyrim 04464A)", tags: [стража, дракон, тишина]}
  - {id: good-raid, text: "Тут в основном мелкие кражи и пьяные драки. Давненько у нас не было хорошего разбойничьего налета.", src: "игра: стражник (Skyrim 0AD7ED)", tags: [город, стража, тишина]}
  - {id: grave-robber, text: "Ух. От этой брони несет смертью. Ты что, могилы грабишь?", src: "игра: стражник (Skyrim 0D5E92)", tags: [склеп драугров, добыча, броня, сундук]}
  - {id: warm-bed, text: "Эх, сейчас бы в теплую постель...", src: "игра: стражник (Skyrim 02BE11)", tags: [ночь, холод, снег, тишина, дорога]}
  - {id: mead-warm, text: "Эх, глотнуть бы сейчас доброго меду... Сразу стало бы теплее и веселее.", src: "игра: стражник (Skyrim 020948)", tags: [холод, снег, выпивка, таверна, дорога]}
  - {id: something-dark, text: "Слышишь? Клянусь, там что-то есть. В темноте.", src: "игра: стражник (Skyrim 0E0FB0)", tags: [ночь, подземелье, пещера, тишина]}
  - {id: belethor-slippery, text: "Сходи в лавку к Белетору. Он скользкий тип, но выбор у него отменный.", src: "игра: стражник Вайтрана (Skyrim 02BDEB)", tags: [Вайтран, лавка, Белетор, торговля]}

  # ---------------------------------------------------------------- М'Айк Лжец
  - {id: maiq-two-weapons, text: "М'Айк носит с собой два оружия, на всякий случай. Если носить одно - вдруг оно сломается?", src: "игра: М'Айк Лжец (Skyrim 0B9D07)", tags: [два оружия, оружие, бой]}
  - {id: maiq-sweetroll, text: "М'Айк как-то наслал два заклинания одновременно и сжег свой сладкий рулет.", src: "игра: М'Айк Лжец (Skyrim 0B9D5A)", tags: [магия, маг, еда]}
  - {id: maiq-invisible-dragons, text: "Драконы никуда не девались. Они просто были невидимы и вели себя очень-очень тихо.", src: "игра: М'Айк Лжец (Skyrim 0B9D5F)", tags: [дракон, тишина]}
  - {id: maiq-werebears, text: "Медведи-оборотни? Медведи? Оборотни? Люди-медведи?", src: "игра: М'Айк Лжец (Skyrim 0B9D61)", tags: [оборотень, дикие земли]}
  - {id: maiq-snow, text: "В Скайриме много снега. Предостаточно. М'Айку совсем не хотелось бы больше снега.", src: "игра: М'Айк Лжец (Skyrim 0B9D62)", tags: [снег, холод, дорога, горы]}
  - {id: maiq-steps, text: "М'Айк однажды поднимался на Высокий Хротгар. Хотел ступеньки посчитать. Но их столько, что сбился со счета.", src: "игра: М'Айк Лжец (Skyrim 0B9D6C)", tags: [Высокий Хротгар, горы, дорога]}
  - {id: maiq-mudcrab, text: "М'Айк недавно видел грязевого краба. Ужасное создание.", src: "игра: М'Айк Лжец (Skyrim 0B9DD2)", tags: [грязевой краб, берег, бой]}
  - {id: maiq-beards, text: "Норды так любят бороды. М'Айк думает, они мечтают о роскошных гривах каджитов.", src: "игра: М'Айк Лжец (Skyrim 0B9DD4)", tags: [город, каджиты, таверна]}
  - {id: maiq-falmer, text: "М'Айк знает, почему фалмеры слепые. И исчезновение двемеров тут совершенно ни при чем. Правда.", src: "игра: М'Айк Лжец (Skyrim 0BA05E)", tags: [фалмеры, двемерские руины, подземелье]}
  - {id: maiq-alone, text: "Некоторые берут с собой друзей. М'Айк думает, путешествовать в одиночку лучше. Никаких споров при дележе трофеев.", src: "игра: М'Айк Лжец (Skyrim 0BA08F)", tags: [добыча, сундук, дорога]}
  - {id: maiq-no-block, text: "Не пытайся блокировать, имея два оружия. Только оконфузишься. И вообще лучше дважды ударить.", src: "игра: М'Айк Лжец (Skyrim 0BA092)", tags: [два оружия, бой]}
  - {id: maiq-targets, text: "Почему солдаты стреляют по мишеням? Стреляя по живым целям, учишься гораздо быстрее.", src: "игра: М'Айк Лжец (Skyrim 0B9DFA)", tags: [лук, бой, Легион]}
  - {id: maiq-soul, text: "Однажды душу М'Айка захватили. Неприятное ощущение. Думай об этом иногда.", src: "игра: М'Айк Лжец (Skyrim 0B9DE4)", tags: [камень душ, магия]}
  - {id: maiq-winterhold, text: "Откуда известно, что есть город Винтерхолд? М'Айк его своими глазами не видел. А ты?", src: "игра: М'Айк Лжец (Skyrim 0B9D56)", tags: [Винтерхолд, дорога]}
  - {id: maiq-shout, text: "М'Айк не понимает, что такого особенного в крике. М'Айк тоже может крикнуть, когда ему захочется.", src: "игра: М'Айк Лжец (Skyrim 0B9DA9)", tags: [крик, Довакин]}
  - {id: maiq-dangerous-friend, text: "М'Айк слышал, что дружить с тобой опасно.", src: "игра: М'Айк Лжец (Skyrim 0BA060)", tags: [гибель, ранение, бой]}

  # ---------------------------------------------------------------- Шеогорат, Цицерон, чудаки
  - {id: sheo-madder, text: "Не сказать, что ты мне безумно нравишься... Будь ты безумнее, я б тебя ценил.", src: "игра: Шеогорат (Skyrim 0D76EE)", tags: [магия, тишина]}
  - {id: sheo-fish-sticks, text: "Я занят - делаю рыбные палочки. Тут нужно тонкое состояние души!", src: "игра: Шеогорат (Skyrim 034BCA)", tags: [еда, тишина]}
  - {id: sheo-cheese, text: "Бабочки, кровь, лис, отрубленная голова... Ах да, и еще сыр! Умереть можно.", src: "игра: Шеогорат (Skyrim 0D87D3)", tags: [бой, еда]}
  - {id: sheo-saying, text: "У меня есть поговорка - мне не видно то, что тебе слышно. Или что-то вроде того.", src: "игра: Шеогорат (Skyrim 02B8B8)", tags: [тишина]}
  - {id: cicero-kill, text: "Давай укокошим кого-нибудь.", src: "игра: Цицерон (Skyrim 09BCA3)", tags: [Тёмное Братство, тишина, бой]}
  - {id: cicero-kill-often, text: "Убивай хорошо. И часто.", src: "игра: Цицерон (Skyrim 06D91C)", tags: [Тёмное Братство, бой]}
  - {id: cicero-spiders, text: "Пауки могут сожрать мне лицо, но верный Цицерон и на шаг не сдвинется!", src: "игра: Цицерон (Skyrim 09BE4A)", tags: [пауки, пещера, подземелье]}
  - {id: nazeem-cloud, text: "Часто приходится бывать в Облачном районе? Ох, что я такое несу - конечно же, нет.", src: "игра: Назим (Skyrim 02AB8F)", tags: [Вайтран, Назим, город]}
  - {id: heimskr-talos, text: "Ты здесь, чтобы услышать слово Талоса!", src: "игра: Хеймскр (Skyrim 02A7B6)", tags: [Вайтран, Хеймскр, храм]}
  - {id: beggar-septims, text: "Подайте монетку старому нищему...", src: "игра: Бренуин (Skyrim 0D3BAD)", tags: [нищий, город, торговля]}
  - {id: bad-beer-beds, text: "На мой вкус и пиво, и матрасы тут паршивые.", src: "игра: (Skyrim 0DA683)", tags: [таверна, выпивка]}
  - {id: khajiit-wares, text: "Если у тебя есть монеты, у каджита есть товар.", src: "игра: каджит-караванщик (Skyrim 072EBB)", tags: [каджиты, торговля]}
  - {id: khajiit-snowflakes, text: "С неба иногда падают какие-то белые хлопья. Так необычно.", src: "игра: каджит-караванщик (Skyrim 072E58)", tags: [снег, каджиты, дорога]}
  - {id: skyrim-for-nords, text: "Скайрим для нордов!", src: "игра: боевой клич (Skyrim)", tags: [Виндхельм, Братья Бури, бой]}

  # ---------------------------------------------------------------- Ралоф: гибель, руины
  - {id: ralof-corpse, text: "Ха. А говорили, ты труп.", src: "игра: Ралоф (Skyrim 0E1755)", tags: [гибель, загрузка, ранение]}
  - {id: ralof-still-breathing, text: "Ты еще дышишь? Мне казалось, тебе точно крышка.", src: "игра: Ралоф (Skyrim 0E1769)", tags: [ранение, гибель, бой]}
  - {id: ralof-father, text: "Говорил мне батя - не соваться в такие места...", src: "игра: Ралоф (Skyrim 0A2021)", tags: [склеп драугров, подземелье, двемерские руины, пещера]}
  - {id: ralof-barber, text: "Повезло нам, что дракон напал именно в этот миг, а? Ох, и не хотелось мне бриться у имперского палача.", src: "игра: Ралоф (Skyrim 056AAC)", tags: [Хелген, дракон, Легион]}
  - {id: ralof-ringing, text: "У тебя все еще звенит в ушах? Надеюсь, это пройдет.", src: "игра: Ралоф (Skyrim 0E176E)", tags: [крик, бой]}

  # ---------------------------------------------------------------- мемы, которых нет в репликах дословно
  - {id: finally-awake, text: "«Эй, ты. Наконец-то очнулся» — так начинается каждая история, которая едет на повозке в Хелген.", src: "мем", tags: [загрузка, гибель, Хелген, дорога, тишина]}
  - {id: cart-helgen, text: "Повозка, которая всегда едет в Хелген, — никогда не садись в повозку со связанными руками.", src: "мем", tags: [дорога, Хелген, Легион]}
  - {id: giant-sky, text: "Великаны отправляют людей в небо одним ударом — домой такие возвращаются через пару дней, сверху.", src: "мем", tags: [великан, лагерь великанов, гибель, бой]}
  - {id: bucket-head, text: "Надень торговцу ведро на голову — и выноси хоть всю лавку, он ничего не увидит.", src: "мем", tags: [кража, вор, лавка, торговля]}
  - {id: carry-burdens, text: "«Я поклялась нести твоё бремя» — как хускарлы, только Гослинг бремя нести не клялся.", src: "мем", tags: [перегруз, хускарл, добыча]}
  - {id: fus-ro-dah, text: "Фус Ро Да — лучший способ закончить спор и отправить собеседника в полёт.", src: "мем", tags: [крик, Довакин, бой]}

  # ---------------------------------------------------------------- своя: Вайтран (new — просмотреть)
  - {id: "g-vaitran-belethor-sestra", text: "Белетор и сестру продать предлагал. Владос, не торгуйся, она уже отказалась.", src: "своя", tags: ["Вайтран", "город", "Белетор", "торговля", "лавка"], new: true}
  - {id: "g-vaitran-nazim-oblachnyi", text: "Назим опять про Облачный район спросит. Владос, сделай вид, что живёшь там.", src: "своя", tags: ["Вайтран", "город", "Назим"], new: true}
  - {id: "g-vaitran-heimskr-golos", text: "Хеймскр проповедует Талосу с утра до ночи. Талос, кажется, уже прячется.", src: "своя", tags: ["Вайтран", "город", "Хеймскр", "храм"], new: true}
  - {id: "g-vaitran-zlatolist-cvetet", text: "Златолист скоро зацветёт, говорят жрицы. Я рисовал его на картах ещё в детстве — до сих пор жду.", src: "своя", tags: ["Вайтран", "город", "храм"], new: true}
  - {id: "g-vaitran-sorantniki-voy", text: "В Йоррваскре так весело воют по ночам. Наверное, песни разучивают.", src: "своя", tags: ["Вайтран", "город", "Соратник", "оборотень", "ночь"], new: true}
  # ---------------------------------------------------------------- своя: Рифтен (new — просмотреть)
  - {id: "g-riften-kanaly-karta", text: "Я бы нанёс рифтенские каналы на карту, но как нарисовать запах?", src: "своя", tags: ["Рифтен", "город"], new: true}
  - {id: "g-riften-strazha-vzyatka", text: "Стражник Рифтена честен: взятку берёт ровно ту, что назвал.", src: "своя", tags: ["Рифтен", "город", "стража"], new: true}
  - {id: "g-riften-mavin-mead", text: "Пьём «Чёрный вереск», Владос. Каждый глоток — монетка Мавен в карман.", src: "своя", tags: ["Рифтен", "город", "выпивка"], new: true}
  - {id: "g-riften-krysinaya-nora", text: "Крысиная нора — какое точное название. Крысы там, кстати, самые честные.", src: "своя", tags: ["Рифтен", "город", "вор", "подземелье"], new: true}
  - {id: "g-riften-greled-sirota", text: "Грелод Добросердечная — вот кому и правда нужно новое имя.", src: "своя", tags: ["Рифтен", "город"], new: true}
  - {id: "g-riften-koshelek-vernulsya", text: "Владос, у тебя кошелёк на месте? Значит, ты не в Рифтене или уже в Гильдии.", src: "своя", tags: ["Рифтен", "город", "кража", "вор"], new: true}
  # ---------------------------------------------------------------- своя: Солитьюд (new — просмотреть)
  - {id: "g-solitude-arka-karta", text: "Город на арке над морем. Картограф, нарисовавший это первым, явно был пьян.", src: "своя", tags: ["Солитьюд", "город", "берег"], new: true}
  - {id: "g-solitude-rogvir-kazn", text: "Казнь Роггвира у ворот! Отличный день для прибытия, Владос, приветливый город.", src: "своя", tags: ["Солитьюд", "город", "стража"], new: true}
  - {id: "g-solitude-bardy-pesnya", text: "В Коллегии бардов меня петь учили. Потом попросили лучше рисовать.", src: "своя", tags: ["Солитьюд", "город"], new: true}
  - {id: "g-solitude-talmor-ulybka", text: "Посол Талмора улыбнулся Владосу. Владос, проверь, всё ли у тебя на месте.", src: "своя", tags: ["Солитьюд", "город", "магия"], new: true}
  - {id: "g-solitude-tullius-plan", text: "Генерал Туллий снова над картой Скайрима. Карта, кстати, моя, ошибки тоже.", src: "своя", tags: ["Солитьюд", "город", "Легион"], new: true}
  - {id: "g-solitude-siniy-dvorets", text: "Синий дворец, синее море. Владос, ты от холода тоже синий — в тон.", src: "своя", tags: ["Солитьюд", "город", "холод", "замок"], new: true}
  # ---------------------------------------------------------------- своя: Виндхельм (new — просмотреть)
  - {id: "g-windhelm-drevneishiy", text: "Виндхельм — старейший город Скайрима. Судя по ветру, и старейший сквозняк.", src: "своя", tags: ["Виндхельм", "город", "холод", "снег"], new: true}
  - {id: "g-windhelm-ulfrik-krik", text: "Ульфрик Криком снёс короля. Владос, а ты своим только кур пугаешь.", src: "своя", tags: ["Виндхельм", "город", "холод", "снег", "крик", "Братья Бури"], new: true}
  - {id: "g-windhelm-ochag-svecha", text: "«Очаг и свеча» — греться, видимо, полагается от одной свечи на всех.", src: "своя", tags: ["Виндхельм", "город", "холод", "снег", "таверна"], new: true}
  - {id: "g-windhelm-borodi-led", text: "Почему у здешних нордов бороды седые? Это иней, Владос. Им всем по двадцать.", src: "своя", tags: ["Виндхельм", "город", "холод", "снег"], new: true}
  - {id: "g-windhelm-gibel-teplo", text: "Если замёрзнешь насмерть, Владос, хоть очнёшься в последнем месте, где было тепло.", src: "своя", tags: ["Виндхельм", "город", "холод", "снег", "гибель"], new: true}
  # ---------------------------------------------------------------- своя: Маркарт (new — просмотреть)
  - {id: "g-markarth-stone-pillow", text: "Владос, в Маркарте даже подушки каменные. Зато вечные, как двемерские обиды.", src: "своя", tags: ["Маркарт", "город", "двемерские руины"], new: true}
  - {id: "g-markarth-everyone-hides", text: "Тут все что-то скрывают. Я, например, скрываю, что заблудился ещё у ворот.", src: "своя", tags: ["Маркарт", "город"], new: true}
  - {id: "g-markarth-cidhna-mine", text: "Шахта Сидна — единственная тюрьма, где за решётку платят киркой.", src: "своя", tags: ["Маркарт", "город", "тюрьма", "шахта"], new: true}
  - {id: "g-markarth-silver-blood", text: "Здесь всё принадлежит Серебряной Крови. Даже, подозреваю, этот воздух.", src: "своя", tags: ["Маркарт", "город"], new: true}
  - {id: "g-markarth-dwemer-map", text: "Пытался нарисовать карту Маркарта. Вышла лестница, уходящая в другую лестницу.", src: "своя", tags: ["Маркарт", "город", "двемерские руины"], new: true}
  - {id: "g-markarth-forsworn-witness", text: "Видел убийство на рынке? Владос, лучше скажи, что ты видел только ступеньки.", src: "своя", tags: ["Маркарт", "город", "стража"], new: true}
  # ---------------------------------------------------------------- своя: Винтерхолд (new — просмотреть)
  - {id: "g-winterhold-half-town", text: "Половина Винтерхолда ушла в море. Вторая половина просто ещё не решилась.", src: "своя", tags: ["Винтерхолд", "город", "снег", "берег"], new: true}
  - {id: "g-winterhold-college-bridge", text: "Мост к Коллегии без перил. Видимо, вступительный экзамен по левитации.", src: "своя", tags: ["Винтерхолд", "город", "снег", "маг"], new: true}
  - {id: "g-winterhold-hate-mages", text: "Владос, не колдуй тут. Местные и от искры в очаге косо смотрят.", src: "своя", tags: ["Винтерхолд", "город", "снег", "магия"], new: true}
  - {id: "g-winterhold-frozen-hearth", text: "Таверна «Замёрзший очаг». Честное название, за это и уважаю.", src: "своя", tags: ["Винтерхолд", "город", "снег", "таверна"], new: true}
  - {id: "g-winterhold-cartographer", text: "Картографы Винтерхолд не перерисовывают. Ждут, пока море доест остальное.", src: "своя", tags: ["Винтерхолд", "город", "снег", "берег"], new: true}
  - {id: "g-winterhold-capital", text: "Это столица владения, Владос. Да, вот эти четыре дома и сугроб.", src: "своя", tags: ["Винтерхолд", "город", "снег"], new: true}
  # ---------------------------------------------------------------- своя: Данстар (new — просмотреть)
  - {id: "g-dawnstar-nightmares", text: "Тут всем снятся кошмары. Мне вот приснилось, что ты платишь за выпивку.", src: "своя", tags: ["Данстар", "город", "холод", "ночь", "выпивка"], new: true}
  - {id: "g-dawnstar-mines-warm", text: "В шахтах Данстара хоть тепло. Поэтому шахтёры и не вылезают.", src: "своя", tags: ["Данстар", "город", "холод", "шахта"], new: true}
  - {id: "g-dawnstar-brotherhood-door", text: "Где-то тут Тёмное Братство. Если найдёшь их дверь, не стучи, пожалуйста.", src: "своя", tags: ["Данстар", "город", "холод", "Тёмное Братство"], new: true}
  - {id: "g-dawnstar-sleep-advice", text: "Местный совет от кошмаров: не спать. Местный совет от холода: тоже не спать.", src: "своя", tags: ["Данстар", "город", "холод", "ночь"], new: true}
  - {id: "g-dawnstar-save-dream", text: "Владос, ты иногда погибаешь и возвращаешься. Может, тебе просто снится Данстар?", src: "своя", tags: ["Данстар", "город", "холод", "гибель"], new: true}
  # ---------------------------------------------------------------- своя: Фолкрит (new — просмотреть)
  - {id: "g-falkreath-quiet", text: "Тихий городок, Владос. Половина жителей вообще не возражает ни против чего.", src: "своя", tags: ["Фолкрит", "город", "тишина"], new: true}
  - {id: "g-falkreath-pines", text: "Рисовал карту окрестностей Фолкрита. Получилось просто сто ёлок и одна могила.", src: "своя", tags: ["Фолкрит", "город", "дикие земли"], new: true}
  - {id: "g-falkreath-dont-die", text: "Владос, не погибай тут. Тебе ведь всё равно вернуться, а местным хлопоты с ямой.", src: "своя", tags: ["Фолкрит", "город", "гибель"], new: true}
  - {id: "g-falkreath-neighbors", text: "Почему Фолкрит такой тихий? Соседи по кладбищу шуметь не позволяют.", src: "своя", tags: ["Фолкрит", "город", "тишина"], new: true}
  - {id: "g-falkreath-real-estate", text: "Лучший дом в Фолкрите — на кладбище. Там хотя бы очереди не убывают.", src: "своя", tags: ["Фолкрит", "город"], new: true}
  # ---------------------------------------------------------------- своя: Морфал (new — просмотреть)
  - {id: "g-morthal-tuman-karta", text: "Нанёс Морфал на карту? Рисуй просто серое пятно — точнее не выйдет.", src: "своя", tags: ["Морфал", "город", "дождь"], new: true}
  - {id: "g-morthal-idgrod-videniya", text: "Ярл Идгрод видит будущее. Наверное, поэтому она такая грустная.", src: "своя", tags: ["Морфал", "город", "дождь"], new: true}
  - {id: "g-morthal-zhiteli-ulybka", text: "Владос, тут кто-нибудь улыбался? Или за это сразу на костёр?", src: "своя", tags: ["Морфал", "город", "дождь"], new: true}
  - {id: "g-morthal-boloto-sapogi", text: "Сапоги я тут потерял ещё в первый день. Теперь бережно ношу болото.", src: "своя", tags: ["Морфал", "город", "дождь"], new: true}
  - {id: "g-morthal-vampir-noch", text: "Не бледней так, Владос, а то местные решат, что ты вампир.", src: "своя", tags: ["Морфал", "город", "дождь", "вампир", "ночь"], new: true}
  - {id: "g-morthal-dozhd-stirka", text: "Морфальская мудрость: зачем стирать одежду, если можно просто выйти на улицу.", src: "своя", tags: ["Морфал", "город", "дождь"], new: true}
  # ---------------------------------------------------------------- своя: Ривервуд (new — просмотреть)
  - {id: "g-riverwood-kamilla-tretiy", text: "Свен, Фендал... Может, и тебе, Владос, за Камиллой приударить? Будешь третьим лишним.", src: "своя", tags: ["Ривервуд", "деревня"], new: true}
  - {id: "g-riverwood-lesopilka", text: "Лесопилка — самое громкое событие Ривервуда. Второе — ты.", src: "своя", tags: ["Ривервуд", "деревня"], new: true}
  - {id: "g-riverwood-vetreny-pik", text: "Над деревней Ветреный пик, полный мертвецов. Зато вид из окна хороший.", src: "своя", tags: ["Ривервуд", "деревня", "склеп драугров", "драугры"], new: true}
  - {id: "g-riverwood-reka-karta", text: "Чертил я Ривервуд: река, лесопилка, таверна. Дольше подписывал, чем рисовал.", src: "своя", tags: ["Ривервуд", "деревня", "таверна"], new: true}
  - {id: "g-riverwood-sven-pesni", text: "Свен поёт Камилле песни. Лучше бы сразу признался, что это проклятие.", src: "своя", tags: ["Ривервуд", "деревня"], new: true}
  # ---------------------------------------------------------------- своя: склеп драугров (new — просмотреть)
  - {id: "g-draugr-plita-nastupil", text: "Видишь плиту на полу? Не наступай. Ну вот, наступил. Пригнись!", src: "своя", tags: ["склеп драугров", "драугры", "подземелье"], new: true}
  - {id: "g-draugr-stolby-zagadka", text: "Столбы с картинками — загадка древних нордов. Ответ обычно на ближайшем трупе.", src: "своя", tags: ["склеп драугров", "драугры", "подземелье", "добыча"], new: true}
  - {id: "g-draugr-sarkofag-tihiy", text: "Этот саркофаг не шевелится. Подозрительно вежливый покойник.", src: "своя", tags: ["склеп драугров", "драугры", "подземелье", "тишина"], new: true}
  - {id: "g-draugr-urna-muka", text: "Владос, ты опять берёшь костную муку? Чья-то бабушка, между прочим.", src: "своя", tags: ["склеп драугров", "драугры", "подземелье", "добыча"], new: true}
  - {id: "g-draugr-mayatnik-pricheska", text: "Маятники тут — лучший цирюльник Скайрима. Стрижёт вместе с головой.", src: "своя", tags: ["склеп драугров", "драугры", "подземелье"], new: true}
  # ---------------------------------------------------------------- своя: двемерские руины (new — просмотреть)
  - {id: "g-dwemer-kuda-ischezli", text: "Двемеры исчезли неизвестно куда. Может, просто устали слушать этот пар?", src: "своя", tags: ["двемерские руины", "подземелье", "фалмеры"], new: true}
  - {id: "g-dwemer-centurion-vezhliviy", text: "Паровой центурион тоже встречает гостей. Только не хлебом.", src: "своя", tags: ["двемерские руины", "подземелье", "фалмеры", "бой"], new: true}
  - {id: "g-dwemer-pereguz-metall", text: "Ты опять тащишь двемерский металлолом? Будем ползти до выхода неделю.", src: "своя", tags: ["двемерские руины", "подземелье", "фалмеры", "перегруз", "добыча"], new: true}
  - {id: "g-dwemer-falmer-tishe", text: "Фалмеры слепые, но слух у них отличный. Так что хватит греметь добычей, Владос.", src: "своя", tags: ["двемерские руины", "подземелье", "фалмеры", "тишина"], new: true}
  # ---------------------------------------------------------------- своя: пещера (new — просмотреть)
  - {id: "g-peshchera-kapli-za-shivorot", text: "Владос, с потолка капает строго за шиворот. Пещера тебя явно невзлюбила.", src: "своя", tags: ["пещера", "подземелье"], new: true}
  - {id: "g-peshchera-zlokrysy-tarakaniy-pir", text: "Злокрысы тут откормленные. Видать, бандиты готовят хуже, чем охраняют.", src: "своя", tags: ["пещера", "подземелье", "еда"], new: true}
  - {id: "g-peshchera-bandity-karta", text: "Нанёс бы эту пещеру на карту, да отметка «бандиты» уже на всех.", src: "своя", tags: ["пещера", "подземелье", "бой"], new: true}
  - {id: "g-peshchera-pautina-uyut", text: "Паутина от стены до стены. Хозяйка явно дома и ждёт гостей к ужину.", src: "своя", tags: ["пещера", "подземелье", "пауки"], new: true}
  - {id: "g-peshchera-fakel-vernyj", text: "Факел гаснет, вода капает, сундук пустой. Владос, ты точно сюда за добычей?", src: "своя", tags: ["пещера", "подземелье", "добыча", "сундук"], new: true}
  # ---------------------------------------------------------------- своя: шахта (new — просмотреть)
  - {id: "g-shahta-kirka-vladosa", text: "Владос, кирку держат за рукоять. Хотя руда от твоего вида и так сыплется.", src: "своя", tags: ["шахта"], new: true}
  - {id: "g-shahta-rudokopy-solnce", text: "Рудокопы спросили, какое сегодня небо. Я сказал «серое» — они обрадовались.", src: "своя", tags: ["шахта"], new: true}
  - {id: "g-shahta-tesno-per", text: "Здесь тесно, а ты ещё полшахты руды в рюкзак засунул.", src: "своя", tags: ["шахта", "перегруз", "добыча"], new: true}
  - {id: "g-shahta-zhila-zhelezo", text: "Опять железная жила. Скайрим богат железом и скромен во всём остальном.", src: "своя", tags: ["шахта", "добыча"], new: true}
  - {id: "g-shahta-kartograf-temnota", text: "Картограф из меня тут никудышный: все стены одного цвета — тёмного.", src: "своя", tags: ["шахта"], new: true}
  - {id: "g-shahta-poslovica-ruda", text: "У рудокопов говорят: копай глубже, ругайся тише — своды слушают.", src: "своя", tags: ["шахта"], new: true}
  # ---------------------------------------------------------------- своя: великаны (new — просмотреть)
  - {id: "g-velikany-syr-mamonta", text: "Сыр из мамонтова молока, Владос. Кто доил — спрашивать не советую.", src: "своя", tags: ["великан", "лагерь великанов", "еда"], new: true}
  - {id: "g-velikany-pastuh-stado", text: "Великан пасёт мамонтов, как пастух коз. Только козы не топчут деревни.", src: "своя", tags: ["великан", "лагерь великанов"], new: true}
  - {id: "g-velikany-kartograf-polet", text: "После удара великана я бы впервые увидел Скайрим сверху. Ценно для картографа!", src: "своя", tags: ["великан", "лагерь великанов", "бой"], new: true}
  - {id: "g-velikany-vlados-geroizm", text: "Владос, ты правда полезешь на великана с кинжалом? Я пока займу место сзади.", src: "своя", tags: ["великан", "лагерь великанов", "бой", "оружие"], new: true}
  - {id: "g-velikany-vozvrat-s-neba", text: "Улетишь в небо — хоть сверху помаши. Потом опять очнёшься тут, как всегда.", src: "своя", tags: ["великан", "лагерь великанов", "гибель"], new: true}
  - {id: "g-velikany-ne-trogaj", text: "Великан не трогает, пока не трогают его. Владос, убери руку от его сундука.", src: "своя", tags: ["великан", "лагерь великанов", "кража", "сундук"], new: true}
  # ---------------------------------------------------------------- своя: драконы (new — просмотреть)
  - {id: "g-drakony-stena-slov-chtenie", text: "Стена слов! Я читать умею, но ты, Владос, почему-то понимаешь больше.", src: "своя", tags: ["дракон", "логово дракона", "крик", "Довакин"], new: true}
  - {id: "g-drakony-dusha-razgovor", text: "Ты съел драконью душу. Надеюсь, она не будет ворчать по ночам.", src: "своя", tags: ["дракон", "логово дракона", "крик", "Довакин", "ночь"], new: true}
  - {id: "g-drakony-kosti-per", text: "Драконьи кости весят как мамонт. Владос, может, кузнеца сюда приведём?", src: "своя", tags: ["дракон", "логово дракона", "крик", "перегруз", "добыча"], new: true}
  - {id: "g-drakony-cheshuya-torg", text: "Драконья чешуя на рынке? Проще дракона уговорить отдать её самому.", src: "своя", tags: ["дракон", "логово дракона", "крик", "торговля", "броня"], new: true}
  - {id: "g-drakony-karta-logov", text: "Я рисовал на картах драконьи логова для красоты. Теперь стыдно — они настоящие.", src: "своя", tags: ["дракон", "логово дракона", "крик"], new: true}
  # ---------------------------------------------------------------- своя: бандиты (new — просмотреть)
  - {id: "g-koshelek-ili-zhizn-vozvrat", text: "«Кошелёк или жизнь?» Владос, отдавай жизнь: ты её всё равно вернёшь.", src: "своя", tags: ["дикие земли", "бой", "дорога", "гибель"], new: true}
  - {id: "g-karty-fortov-bandity", text: "На моих картах у каждого форта подпись «бандиты». Так я экономил чернила.", src: "своя", tags: ["дикие земли", "бой", "дорога", "замок"], new: true}
  - {id: "g-bandit-v-mehovom-snegu", text: "Бандит в одних мехах посреди метели. Вот он, настоящий норд.", src: "своя", tags: ["дикие земли", "бой", "дорога", "снег", "холод"], new: true}
  - {id: "g-obyskal-grabitelya", text: "Владос, ты обыскал бандита, а ведь он сам собирался обыскать тебя.", src: "своя", tags: ["дикие земли", "бой", "дорога", "добыча"], new: true}
  - {id: "g-ne-grab-sorok-mechey", text: "Старое солитьюдское правило: не грабь путника, который тащит сорок мечей.", src: "своя", tags: ["дикие земли", "бой", "дорога", "перегруз", "Солитьюд"], new: true}
  - {id: "g-naverno-pokazalos", text: "Бандиты шепчутся: «Наверное, показалось». Владос, ты опять крадёшься в латах?", src: "своя", tags: ["дикие земли", "бой", "дорога", "броня", "вор"], new: true}
  # ---------------------------------------------------------------- своя: таверна (new — просмотреть)
  - {id: "g-ragnar-ryzhiy-platim", text: "Бард снова затянул «Рагнара Рыжего». Мы ведь платим, чтобы он перестал?", src: "своя", tags: ["таверна", "выпивка", "еда"], new: true}
  - {id: "g-desyat-monet-krovat", text: "Кровать за десять монет. Дешевле только помереть: тебя же всё равно вернёт.", src: "своя", tags: ["таверна", "выпивка", "еда", "гибель", "ночь"], new: true}
  - {id: "g-syr-posredi-boya", text: "Владос жуёт двенадцать сырных голов посреди боя. А враги вежливо ждут.", src: "своя", tags: ["таверна", "выпивка", "еда", "бой"], new: true}
  - {id: "g-voda-holodnaya-meduha", text: "Норд пьёт медовуху не от жажды. Просто вода в Скайриме ледяная.", src: "своя", tags: ["таверна", "выпивка", "еда", "холод"], new: true}
  - {id: "g-chyorny-veresk-chestnost", text: "Медовуха «Чёрный вереск» — самое честное в Рифтене. Ну, на треть.", src: "своя", tags: ["таверна", "выпивка", "еда", "Рифтен"], new: true}
  - {id: "g-shataetsya-taverna", text: "Владос, ты выпил всю медовуху, а шатается почему-то таверна.", src: "своя", tags: ["таверна", "выпивка", "еда"], new: true}
  # ---------------------------------------------------------------- своя: лавка (new — просмотреть)
  - {id: "g-prodal-emu-lavku", text: "У торговца кончилось золото. Владос, ты что, продал ему его же лавку?", src: "своя", tags: ["лавка", "торговля"], new: true}
  - {id: "g-torgovets-naoborot", text: "Купил за сто, продал за десять. Владос, ты торговец наоборот.", src: "своя", tags: ["лавка", "торговля"], new: true}
  - {id: "g-ego-zhe-lozhka", text: "Торговец не берёт краденое. Владос, это же его собственная ложка.", src: "своя", tags: ["лавка", "торговля", "кража"], new: true}
  - {id: "g-kotyol-staryovshchik", text: "Тащишь на продажу котёл? Мы искатели приключений или старьёвщики?", src: "своя", tags: ["лавка", "торговля", "перегруз"], new: true}
  - {id: "g-zoloto-v-sunduke", text: "Торговец спит, а золото у него в сундуке. Владос, даже не думай.", src: "своя", tags: ["лавка", "торговля", "сундук", "взлом", "ночь"], new: true}
  # ---------------------------------------------------------------- своя: храм (new — просмотреть)
  - {id: "g-arkey-vozvrat", text: "Помолись Аркею, Владос. Хотя ты и так возвращаешься, когда тебе вздумается.", src: "своя", tags: ["храм", "гибель"], new: true}
  - {id: "g-mara-ne-dlya-boya", text: "Благословение Мары, Владос, — это чтобы жениться, а не чтобы рубиться.", src: "своя", tags: ["храм", "бой"], new: true}
  - {id: "g-talos-ne-zametil", text: "Талмор запретил Талоса. А Талос, похоже, этого даже не заметил.", src: "своя", tags: ["храм", "магия"], new: true}
  - {id: "g-lekar-chashche-taverny", text: "Владос, к жрецам ты ходишь лечиться чаще, чем в таверну пить.", src: "своя", tags: ["храм", "ранение", "таверна"], new: true}
  - {id: "g-zenitar-pered-torgom", text: "Девять божеств, а Владос молится только Зенитару, и то перед торгом.", src: "своя", tags: ["храм", "торговля"], new: true}
  - {id: "g-ne-krichi-v-hrame", text: "В храме тихо. Только не кричи, Владос, а то проснутся все Девять.", src: "своя", tags: ["храм", "крик", "тишина", "Довакин"], new: true}
  # ---------------------------------------------------------------- своя: кража (new — просмотреть)
  - {id: "g-lockpick-graveyard", text: "Владос, ты сломал столько отмычек, что кузнецы Рифтена молятся на тебя.", src: "своя", tags: ["кража", "вор", "взлом", "Рифтен"], new: true}
  - {id: "g-guard-saw-cheese", text: "Ночь, темнота, ты в капюшоне — а стражник всё равно знает, что сыр украл ты.", src: "своя", tags: ["кража", "вор", "взлом", "стража", "ночь"], new: true}
  - {id: "g-riften-saying-pockets", text: "В Рифтене говорят: «Держи кошель крепче, а друга — подальше от кошеля».", src: "своя", tags: ["кража", "вор", "взлом", "Рифтен", "город"], new: true}
  - {id: "g-stolen-fork-prison", text: "Одна украденная вилка — и вот ты снова в тюрьме, отличный обмен.", src: "своя", tags: ["кража", "вор", "взлом", "тюрьма", "стража"], new: true}
  - {id: "g-expert-lock-ten-picks", text: "Сложный замок: десять отмычек, полчаса ругани, а внутри — пара септимов.", src: "своя", tags: ["кража", "вор", "взлом", "сундук", "добыча"], new: true}
  - {id: "g-own-house-habit", text: "Вскрываешь замки так привычно, что, боюсь, и к себе домой лезешь через окно.", src: "своя", tags: ["кража", "вор", "взлом"], new: true}
  # ---------------------------------------------------------------- своя: сундук (new — просмотреть)
  - {id: "g-three-septims-cheese", text: "Древний сундук, ловушки, драугры… и награда — три септима и кусок сыра.", src: "своя", tags: ["сундук", "добыча", "склеп драугров", "драугры"], new: true}
  - {id: "g-sack-gourmet", text: "Сыр из мешка в пещере — смелый выбор, даже для норда.", src: "своя", tags: ["сундук", "добыча", "еда", "пещера"], new: true}
  - {id: "g-carry-buckets", text: "Зачем тебе двадцать вёдер? Решил открыть лавку для слепых торговцев?", src: "своя", tags: ["сундук", "добыча", "перегруз", "торговля"], new: true}
  - {id: "g-cartographer-chest-map", text: "Как картограф скажу: на твоей карте сокровищ одни мешки с капустой.", src: "своя", tags: ["сундук", "добыча"], new: true}
  - {id: "g-overloaded-walk", text: "Ты так набил карманы, что скоро до города пойдёшь, а приползёшь только к утру.", src: "своя", tags: ["сундук", "добыча", "перегруз", "дорога"], new: true}
  # ---------------------------------------------------------------- своя: бой (new — просмотреть)
  - {id: "g-potion-buffet", text: "Посреди боя выпить двадцать зелий — это уже не битва, а пирушка.", src: "своя", tags: ["бой", "ранение", "зелья"], new: true}
  - {id: "g-back-stab-fan", text: "Враги так любят бить тебе в спину — видно, лицо твоё их пугает.", src: "своя", tags: ["бой", "ранение"], new: true}
  - {id: "g-rushes-first", text: "Ты кидаешься в драку раньше, чем я успеваю спросить, с кем мы деремся.", src: "своя", tags: ["бой", "ранение"], new: true}
  - {id: "g-died-again-strange", text: "Вчера тебя убили, а сегодня ты опять здесь. Странный мир, Владос.", src: "своя", tags: ["бой", "ранение", "гибель"], new: true}
  - {id: "g-mudcrab-veteran", text: "Драконов не боишься, а от грязевого краба отступаешь шагами назад?", src: "своя", tags: ["бой", "ранение", "грязевой краб", "дракон", "берег"], new: true}
  - {id: "g-bandage-map", text: "Твоими шрамами можно карту Скайрима рисовать — и пара островов останется.", src: "своя", tags: ["бой", "ранение"], new: true}
  # ---------------------------------------------------------------- своя: зелья и магия (new — просмотреть)
  - {id: "g-fire-indoors", text: "Огненный шар в таверне? Трактирщик теперь будет брать с нас за новые стены.", src: "своя", tags: ["зелья", "магия", "маг", "таверна"], new: true}
  - {id: "g-potion-taste", text: "Твоё зелье исцеляет раны и, кажется, вкус к жизни отбивает.", src: "своя", tags: ["зелья", "магия", "маг", "ранение"], new: true}
  - {id: "g-alchemy-anything", text: "Крылья бабочки, глаз тролля, мой сапог… стоп, это был мой сапог!", src: "своя", tags: ["зелья", "магия", "маг"], new: true}
  - {id: "g-winterhold-college", text: "В Винтерхолде маги колледж сберегли, а весь остальной город уплыл в море.", src: "своя", tags: ["зелья", "магия", "маг", "Винтерхолд"], new: true}
  - {id: "g-soul-gem-cheese", text: "Ты бы ещё душу грязевого краба в камень запихнул… ох, ты уже?", src: "своя", tags: ["зелья", "магия", "маг", "камень душ", "грязевой краб"], new: true}
  - {id: "g-frost-spell-skyrim", text: "Колдовать морозом в Скайриме — всё равно что носить снег в Виндхельм.", src: "своя", tags: ["зелья", "магия", "маг", "холод", "снег", "Виндхельм"], new: true}
  # ---------------------------------------------------------------- своя: погода и ночь (new — просмотреть)
  - {id: "g-metel-karta", text: "В такую метель я бы нарисовал карту Скайрима одним белым листом.", src: "своя", tags: ["снег", "холод", "ночь", "дождь", "дикие земли"], new: true}
  - {id: "g-nos-otvalitsya", text: "Владос, проверь мой нос. Если на месте, значит, мороз ещё не всерьёз.", src: "своя", tags: ["снег", "холод", "ночь", "дождь"], new: true}
  - {id: "g-dozhd-riften", text: "Дождь в Рифтене — единственное, что там льётся честно.", src: "своя", tags: ["снег", "холод", "ночь", "дождь", "Рифтен", "город"], new: true}
  - {id: "g-mammont-sneg", text: "Ночью в метели любой сугроб похож на великана. И наоборот, Владос, увы.", src: "своя", tags: ["снег", "холод", "ночь", "дождь", "великан", "дикие земли"], new: true}
  # ---------------------------------------------------------------- своя: Владос-вор (new — просмотреть)
  - {id: "g-nichego-ne-trogai", text: "Владос, ничего не трогай. Это я не тебе, это я твоим карманам.", src: "своя", tags: ["вор", "кража", "Рифтен"], new: true}
  - {id: "g-teni-zhaluyutsya", text: "Ты в тенях так часто сидишь, что они уже берут с тебя за постой.", src: "своя", tags: ["вор", "кража", "Рифтен", "ночь"], new: true}
  - {id: "g-kartograf-zamki", text: "Я рисую карты, где стоят дома. Ты — где в них стоят сундуки.", src: "своя", tags: ["вор", "кража", "Рифтен", "сундук", "взлом"], new: true}
  - {id: "g-otmychki-zvenyat", text: "У тебя отмычки звенят громче, чем у стражника доспехи.", src: "своя", tags: ["вор", "кража", "Рифтен", "взлом", "стража"], new: true}
  - {id: "g-rifty-vozduh", text: "В Рифтене даже воздух дышит украдкой, чтобы не обвинили.", src: "своя", tags: ["вор", "кража", "Рифтен", "город"], new: true}
  - {id: "g-peregruz-tarelki", text: "Ты опять перегружен? Сколько там тарелок, Владос, честно?", src: "своя", tags: ["вор", "кража", "Рифтен", "перегруз"], new: true}
  # ---------------------------------------------------------------- своя: Владос-Соратник (new — просмотреть)
  - {id: "g-jorrvaskr-med", text: "В Йоррваскре мёд пьют так, будто завтра Совнгард уже открыт.", src: "своя", tags: ["Соратник", "оборотень", "Вайтран", "выпивка"], new: true}
  - {id: "g-luna-povyl", text: "Луна взошла, а ты уже чешешься. Совпадение, конечно.", src: "своя", tags: ["Соратник", "оборотень", "ночь"], new: true}
  - {id: "g-syroe-myaso", text: "Владос, мясо принято жарить. Хотя бы для вида, при людях.", src: "своя", tags: ["Соратник", "оборотень", "еда"], new: true}
  - {id: "g-krug-tayna", text: "Круг хранит великую тайну. И плохо выметает шерсть из углов.", src: "своя", tags: ["Соратник", "оборотень"], new: true}
  - {id: "g-sobaka-laet", text: "Собаки на тебя не лают. Наверное, своего узнают.", src: "своя", tags: ["Соратник", "оборотень", "город"], new: true}
  - {id: "g-shchit-bratstvo", text: "Соратники — братья по щиту. И по расчёске, судя по тебе.", src: "своя", tags: ["Соратник", "оборотень"], new: true}
  # ---------------------------------------------------------------- своя: Владос-маг (new — просмотреть)
  - {id: "g-arhimag-chai", text: "Ты теперь Архимаг? Значит, чай в Коллегии заваривать тебе?", src: "своя", tags: ["маг", "магия", "Винтерхолд"], new: true}
  - {id: "g-knigi-perogruz", text: "Ты опять перегружен. Владос, учи заклинания, а не носи книги.", src: "своя", tags: ["маг", "магия", "Винтерхолд", "перегруз"], new: true}
  - {id: "g-plamya-brovi", text: "Твоё пламя обогреет весь отряд. Особенно мои брови.", src: "своя", tags: ["маг", "магия", "Винтерхолд", "бой"], new: true}
  - {id: "g-vinterhold-ostatki", text: "Винтерхолд был большим городом. Потом пришли маги. Совпадение, конечно.", src: "своя", tags: ["маг", "магия", "Винтерхолд", "город"], new: true}
  # ---------------------------------------------------------------- своя: Владос-Довакин (new — просмотреть)
  - {id: "g-stupeni-hrotgara-schet", text: "Семь тысяч ступеней наверх, Владос, а вниз, я заметил, ты ищешь короткую — с обрыва.", src: "своя", tags: ["Довакин", "крик", "дракон", "Высокий Хротгар", "горы", "гибель"], new: true}
  - {id: "g-drakon-dusha-vmesto-obeda", text: "Ты съедаешь душу дракона, а мне потом таскать его кости. Справедливо, ничего не скажешь.", src: "своя", tags: ["Довакин", "крик", "дракон", "добыча", "перегруз"], new: true}
  - {id: "g-tuum-u-torgovca", text: "Владос, крикни на торговца — вдруг Ту'ум и цены сбивает?", src: "своя", tags: ["Довакин", "крик", "дракон", "торговля", "лавка"], new: true}
  - {id: "g-dovakin-snova-vstal", text: "Опять тебя дракон спалил, а ты стоишь у входа как ни в чём не бывало. Мне одному страшно?", src: "своя", tags: ["Довакин", "крик", "дракон", "гибель", "загрузка"], new: true}
  - {id: "g-kartograf-i-drakony", text: "Сколько карт я начертил — и ни разу не отметил «тут дракон». Теперь отмечаю всё.", src: "своя", tags: ["Довакин", "крик", "дракон", "логово дракона", "горы"], new: true}

  # ---------------------------------------------------------------- своя: тюрьма (new — просмотреть)
  - {id: "g-tyurma-otmychka-v-tyufyake", text: "В каждой тюрьме Скайрима в тюфяке лежит отмычка. Стражники явно скидываются нам на побег.", src: "своя", tags: ["тюрьма", "стража", "взлом"], new: true}
  - {id: "g-tyurma-shtraf-ili-sidet", text: "Штраф или камера, Владос? Не переживай, твои навыки за ночь отсидки тоже усохнут.", src: "своя", tags: ["тюрьма", "стража"], new: true}
  - {id: "g-tyurma-sunduk-konfiskata", text: "Сундук с конфискатом в двух шагах от камеры. Стража у нас заботливая.", src: "своя", tags: ["тюрьма", "стража", "сундук", "добыча"], new: true}
  - {id: "g-tyurma-karta-kamery", text: "Я картограф, Владос. Нарисовал карту твоей камеры: четыре стены и полная безнадёжность.", src: "своя", tags: ["тюрьма", "стража"], new: true}
  - {id: "g-tyurma-pereguz-konfiskat", text: "Стражник забрал твои вещи и до сих пор отдышаться не может: шесть сыров и котелок.", src: "своя", tags: ["тюрьма", "стража", "перегруз", "кража"], new: true}
  - {id: "g-tyurma-dovakin-v-kamere", text: "Владос покоритель драконов, а замок решётки открыть не может. Сидит, ждёт отмычку.", src: "своя", tags: ["тюрьма", "стража", "Довакин", "взлом"], new: true}
  # ---------------------------------------------------------------- своя: дорога (new — просмотреть)
  - {id: "g-doroga-volk-provodnik", text: "Этот волк бежит за нами от самого Ривервуда. Наверное, тоже с картой не дружит.", src: "своя", tags: ["дорога", "дикие земли", "тишина", "горы", "Ривервуд"], new: true}
  - {id: "g-doroga-medved-tishina", text: "Тишина в лесу, Владос, значит одно: медведь тоже нас слушает.", src: "своя", tags: ["дорога", "дикие земли", "тишина", "горы"], new: true}
  - {id: "g-doroga-pereval-ryadom", text: "По карте до перевала рукой подать. Если рука длиной с Глотку Мира.", src: "своя", tags: ["дорога", "дикие земли", "тишина", "горы", "Высокий Хротгар"], new: true}
  - {id: "g-doroga-povozka-bez-hekgena", text: "Наняли повозку, а она привезла нас не в Хелген. Владос, я почти разочарован.", src: "своя", tags: ["дорога", "дикие земли", "тишина", "горы", "Хелген"], new: true}
  - {id: "g-doroga-kozya-tropa", text: "Владос, ты опять лезешь в гору по отвесной скале. Дорога вон, вокруг.", src: "своя", tags: ["дорога", "дикие земли", "тишина", "горы"], new: true}
  # ---------------------------------------------------------------- своя: гибель (new — просмотреть)
  - {id: "g-sovngard-ochered", text: "Совнгард подождёт, Владос. Там и так очередь из нордов до самого моста.", src: "своя", tags: ["гибель", "загрузка", "ранение"], new: true}
  - {id: "g-snachala-zelye", text: "В этот раз давай иначе, Владос: сначала зелье, потом геройство.", src: "своя", tags: ["гибель", "загрузка", "ранение", "зелья", "бой"], new: true}
  - {id: "g-kartograf-tri-raza", text: "Знал я картографа, что умер трижды. Ты, Владос, обгоняешь его к обеду.", src: "своя", tags: ["гибель", "загрузка", "ранение"], new: true}
  - {id: "g-obryv-vniz-golovoj", text: "Владос, а в этот раз попробуем спуститься с горы ногами вперёд?", src: "своя", tags: ["гибель", "загрузка", "ранение", "горы"], new: true}
  # ---------------------------------------------------------------- своя: перегруз (new — просмотреть)
  - {id: "g-krab-obognal", text: "Владос, ты ползёшь как улитка. Нас только что обогнал грязевой краб.", src: "своя", tags: ["перегруз", "добыча", "торговля", "грязевой краб", "дорога"], new: true}
  - {id: "g-dvemer-posuda", text: "Двемеры исчезли, а грязную посуду, видать, оставили тебе, Владос.", src: "своя", tags: ["перегруз", "добыча", "торговля", "двемерские руины"], new: true}
  - {id: "g-shlem-dvenadcat", text: "Двенадцатый железный шлем? Владос, у тебя же одна голова, я считал.", src: "своя", tags: ["перегруз", "добыча", "торговля", "броня"], new: true}
  - {id: "g-tarelka-shchit", text: "Двемерская тарелка тебе зачем — есть с неё или от дракона прикрываться?", src: "своя", tags: ["перегруз", "добыча", "торговля", "двемерские руины", "дракон"], new: true}
  - {id: "g-pravilo-kartografov", text: "Правило картографов: чем тяжелее мешок, тем длиннее дорога на карте.", src: "своя", tags: ["перегруз", "добыча", "торговля", "дорога"], new: true}
  - {id: "g-sem-syrov", text: "Стонешь, что тяжело? Выброси хоть один из семи сырных кругов, Владос.", src: "своя", tags: ["перегруз", "добыча", "торговля", "еда"], new: true}
