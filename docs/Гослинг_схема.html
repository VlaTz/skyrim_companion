<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Схема Гослинга</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #c9c6bd; --grid: #e7e4dc;
  --chip: #ffffff; --chip-ink: #2a2a2e; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  --ok: #2f9e44; --new: #e8a317; --plan: #9a9aa0; --sel: #2563eb;
  /* Цвет блока — свой у каждого (оттенки по кругу), серые — служебные. Статусы — только точки (--ok, --new, --plan). */
  --c-player: #dc2626; --c-persona: #ea580c; --c-game: #d97706; --c-mod: #a16207; --c-diar: #65a30d;
  --c-mem: #16a34a; --c-know: #059669; --c-perc: #0d9488; --c-tools: #0891b2; --c-voice: #2563eb;
  --c-talk: #4f46e5; --c-brain: #7c3aed; --c-think: #a21caf; --c-jokes: #db2777; --c-dev: #57534e; --c-plan: #71717a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17171a; --panel: #212125; --ink: #ececf0; --muted: #a0a0a8; --line: #4a4a52; --grid: #222226;
    --chip: #2a2a2f; --chip-ink: #e6e6ea; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
    --sel: #60a5fa;
  }
}
:root[data-theme="dark"] {
  --bg: #17171a; --panel: #212125; --ink: #ececf0; --muted: #a0a0a8; --line: #4a4a52; --grid: #222226;
  --chip: #2a2a2f; --chip-ink: #e6e6ea; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
  --sel: #60a5fa;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
header { position: fixed; inset: 0 0 auto 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 8px 14px;
  align-items: center; padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
header .sub { color: var(--muted); font-size: 12.5px; }
.tools { display: flex; gap: 6px; align-items: center; margin-left: auto; flex-wrap: wrap; }
button, input { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 10px; }
button { cursor: pointer; } button:hover { border-color: var(--sel); }
input { width: 190px; }
.legend { display: flex; gap: 10px; font-size: 12px; color: var(--muted); align-items: center; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
#canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none;
  user-select: none; -webkit-user-select: none; }  /* тащим карту — текст не выделяется */
body.dragging-map { user-select: none; -webkit-user-select: none; }
#canvas.dragging { cursor: grabbing; }
.grp-rect { fill: color-mix(in srgb, var(--block) 7%, var(--panel)); stroke: var(--block); stroke-width: 2.5; filter: drop-shadow(0 2px 6px rgba(0,0,0,.07)); cursor: pointer; }
.grp-title { font-size: 22px; font-weight: 700; fill: var(--ink); pointer-events: none; }
.grp-sub { font-size: 13px; fill: var(--muted); pointer-events: none; font-family: ui-monospace, Consolas, monospace; }
.chip { cursor: pointer; }
.chip rect { fill: color-mix(in srgb, var(--block) 12%, var(--chip)); stroke: color-mix(in srgb, var(--block) 45%, var(--line)); stroke-width: 1; }
.chip:hover rect { stroke: var(--sel); }
.chip text { font-size: 15px; fill: var(--chip-ink); pointer-events: none; }
.chip.plan rect { stroke-dasharray: 5 4; }
.edge { fill: none; stroke: var(--line); stroke-width: 2.2; }
.edge-label { font-size: 13px; fill: var(--muted); }
.edge-label-bg { fill: var(--bg); }
.center { cursor: pointer; }
.center-ring { fill: none; stroke: var(--ink); stroke-width: 7; }
.center-halo { fill: var(--panel); filter: drop-shadow(0 6px 24px rgba(0,0,0,.18)); }
.center-title { font-size: 58px; font-weight: 800; fill: var(--ink); letter-spacing: .5px; }
.center-sub { font-size: 24px; fill: var(--muted); }
.center:hover .center-ring { stroke: var(--sel); }
.dim { opacity: .18; }
.selected > rect, rect.selected { stroke: var(--sel) !important; stroke-width: 3 !important; }
.hl { stroke: var(--sel) !important; stroke-width: 3.4; }
.hl-label { fill: var(--sel) !important; font-weight: 600; }
.match rect { stroke: var(--sel); stroke-width: 2.5; }
aside { position: fixed; z-index: 4; top: 62px; right: 12px; bottom: 12px; width: min(440px, calc(100vw - 24px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  padding: 18px 20px; overflow: auto; transform: translateX(110%); transition: transform .2s ease; }
aside.open { transform: none; }
aside h2 { margin: 0 34px 2px 0; font-size: 19px; }
aside .path { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
aside .status { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; margin-bottom: 10px;
  border: 1px solid var(--line); }
aside code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; background: color-mix(in srgb, var(--line) 30%, transparent);
  padding: 1px 4px; border-radius: 4px; }
aside ul { padding-left: 18px; margin: 6px 0; } aside li { margin: 3px 0; }
aside p { margin: 6px 0; }
aside h3 { font-size: 15px; margin: 16px 0 4px; }
aside ol { padding-left: 20px; margin: 6px 0; }
aside a[data-go] { color: var(--sel); cursor: pointer; text-decoration: none; }
aside table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 6px 0; }
aside th, aside td { text-align: left; vertical-align: top; padding: 5px 6px; border-bottom: 1px solid var(--line); }
aside th { color: var(--muted); font-weight: 600; }
aside .files { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
aside .kids { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
aside .kids button { margin: 3px 4px 3px 0; font-size: 12.5px; padding: 3px 8px; }
aside .close { position: absolute; top: 12px; right: 12px; padding: 2px 9px; }
aside .links { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; }
aside .links a { color: var(--sel); cursor: pointer; text-decoration: none; }
.hint { position: fixed; z-index: 2; left: 16px; bottom: 12px; color: var(--muted); font-size: 12px;
  background: color-mix(in srgb, var(--bg) 85%, transparent); padding: 4px 8px; border-radius: 8px; }
@media (max-width: 700px) {
  header { padding: 8px 16px; } .legend { display: none; } input { width: 130px; }
  aside { top: auto; left: 12px; right: 12px; width: auto; height: 55vh; transform: translateY(110%); }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Гослинг — из чего он состоит</h1>
    <div class="sub">Тащи мышью, крути колесо, кликни на Гослинга, блок или его часть — справа подробности</div>
  </div>
  <div class="tools">
    <div class="legend">
      <span><span class="dot" style="background:var(--ok)"></span>работает в игре</span>
      <span><span class="dot" style="background:var(--new)"></span>сделано, не проверено</span>
      <span><span class="dot" style="background:transparent;border:1.5px dashed var(--plan)"></span>в планах</span>
      <span>· цвет карточки — свой у каждого блока</span>
    </div>
    <input id="search" type="search" placeholder="Найти: мысли, книги, F8…" aria-label="Поиск по схеме">
    <button id="about" title="Как устроен Гослинг: агент, инструменты, модели">Как устроен</button>
    <button id="zoomOut" title="Отдалить">−</button>
    <button id="zoomIn" title="Приблизить">+</button>
    <button id="fit" title="Показать всё (Esc)">Общий вид</button>
    <button id="theme" title="Светлая / тёмная">◐</button>
  </div>
</header>
<svg id="canvas" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Схема устройства Гослинга">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"></path>
    </marker>
    <marker id="arrow-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sel)"></path>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="var(--grid)" stroke-width="1"></path>
    </pattern>
  </defs>
  <g id="world">
    <rect x="-4000" y="-4000" width="12000" height="12000" fill="url(#grid)"></rect>
    <g id="edges"></g>
    <g id="groups"></g>
    <g id="center"></g>
  </g>
</svg>
<aside id="panel" aria-live="polite">
  <button class="close" id="close" title="Закрыть">✕</button>
  <div id="panelBody"></div>
</aside>
<div class="hint">Двойной клик — приблизить блок · Esc — общий вид</div>

<script>
// ------------------------------------------------------------------ данные: блоки, их части и связи
// s: ok — работает в игре, new — сделано, не проверено в игре, plan — в планах.
const GROUPS = [
 { id: "game", col: 0, color: "--c-game", title: "Игра: SKSE-плагин", sub: "skse_plugin/src  (C++, CommonLibSSE-NG)",
   d: `<p>Плагин внутри Skyrim SE 1.7.104: смотрит, что происходит в игре, и шлёт это сервису по HTTP
   (<code>POST /game/event</code>); забирает команды «скажи» долгим опросом (<code>GET /game/commands</code>).</p>
   <p>Принцип: функции игры «по адресу» на 1.7.104 не вызываем — читаем поля, события, Papyrus, Scaleform.</p>
   <p>Сборка: <code>cd skse_plugin &amp;&amp; xmake build -y</code> → DLL в мод MO2 «Skyrim Companion» (только при закрытой игре).
   Лог: <code>Documents\\My Games\\Skyrim Special Edition\\SKSE\\SkyrimCompanion.log</code>.</p>`,
   files: "Events.cpp, Voice.cpp, Quests.cpp, Player.cpp, Profile.cpp, Net.cpp",
   kids: [
    { id: "g-status", t: "Снимок обстановки (status)", s: "ok", d: `<p>Каждые 2 с: место, владение, ячейка, помещение или улица, время, погода,
      здоровье, бой, кто рядом (~35 м: враждебен, мёртв, спутник, «уникальный», раса), враги вдали (~140 м — дракон в небе),
      собеседник игрока (5 минут: расстояние, враждебен, бежит), где NPC Гослинг. ID персонажа — из имени сейва.</p>` },
    { id: "g-events", t: "События игры", s: "ok", d: `<ul><li>бой начался / закончился (с кем), убит кто-то рядом;</li>
      <li>смена локации, подобрал с земли;</li><li>задействовал: рычаг, сундук, обыскал тело, мебель;</li>
      <li>отпер ключом (замок сменился рядом + игрок его активировал);</li><li>применил Крик (заклинание типа «голос»);</li>
      <li>собеседник убегает (быстрее 3,5 м/с два тика подряд).</li></ul>` },
    { id: "g-npc", t: "Реплики NPC рядом", s: "ok", d: `<p><code>TESTopicInfoEvent</code> в ~25 м: кто и какая реплика (файл + номер INFO).
      Текст сервис берёт сам из файлов игры — ни субтитров, ни функций по адресу. Меню разговора открыто/закрыто — отдельным событием.</p>
      <p>Ограничение: звуки сцен (крик Седобородых «До-ва-кин») — не реплики, их не слышно.</p>` },
    { id: "g-quests", t: "Журнал, профиль, статистика", s: "ok", d: `<ul><li><b>quests</b> — активные задания: цели, отмеченное, выполненные;</li>
      <li><b>profile</b> — раса, уровень, 5 лучших навыков, фракции с рангом, награды за голову, пройденные крупные квесты;</li>
      <li><b>stat</b> — игровая статистика (украдено, взломано, слово силы…), накопленным значением.</li></ul>` },
    { id: "g-death", t: "Гибель игрока", s: "new", d: `<p><code>player_died</code> {killer, race}: кто убил (нет убийцы — упал, утонул, ловушка).
      Гослинг скажет об этом после загрузки сейва. В лог плагина — «Игрок погиб: …».</p>` },
    { id: "g-books", t: "Книги, которые читает Игрок", s: "ok", d: `<p><code>book_read</code>: открылось меню книги (из сумки или с полки) —
      какая книга, читаем из переменной меню (<code>BookMenu::GetTargetForm</code>, чтение по Address Library). Текст сервис берёт из файлов игры.
      В лог — «Книга открыта: …».</p>` },
    { id: "g-exchange", t: "Обмен вещами с Гослингом", s: "ok", d: `<p><code>gosling_items</code> {given, taken}: игрок отдал Гослингу или забрал у него.
      Перекладывают пачкой — копим и шлём через 2 с тишины. В лог — «Обмен с Гослингом: отдал N, забрал M».</p>` },
    { id: "g-say", t: "Команда «скажи»", s: "ok", d: `<p>Сервис кладёт .wav + .lip в мод и шлёт команду → Papyrus <code>GoslingVoice.SayLine</code> →
      <code>Actor.Say()</code>. Сразу после прошлой фразы Say() отбрасывается — повторяем до 10 с, пока звук не пошёл.
      Субтитр — через HUD <code>ShowSubtitle</code>. Команда, простоявшая &gt; 2 с, не выполняется.</p>` },
   ] },
 { id: "mod", col: 0, color: "--c-mod", title: "Мод Gosling.esp", sub: "tools/build_gosling_esp.py",
   d: `<p>Гослинг как NPC в игре — чтобы говорил из своих уст. Собирается без Creation Kit:
   <code>python tools/build_gosling_esp.py --install</code> → <code>D:\\Games\\Modding\\MO2\\mods\\Gosling</code>.</p>`,
   files: "Gosling.esp, Seq\\Gosling.seq, Scripts\\GoslingVoice.pex (mod/Scripts/Source)",
   kids: [
    { id: "m-npc", t: "NPC Гослинг", s: "ok", d: `<p>По образцу Эрика Грозного Убийцы, свой тип голоса <code>GoslingVoice</code>, лицо.</p>` },
    { id: "m-quest", t: "Квест GoslingVQ и темы-заглушки", s: "ok", d: `<p>Две темы-заглушки, через которые звучат реплики.
      Квест «стартует с игрой» с диалогами требует <code>Seq\\Gosling.seq</code> — без него Say() молча не звучит (главные грабли).</p>` },
    { id: "m-files", t: "Перезаписываемые .wav и .lip", s: "ok", d: `<p>MO2 строит виртуальную Data при запуске, поэтому файлы-заглушки должны существовать заранее;
      сервис перезаписывает их перед каждой фразой.</p>` },
   ] },
 { id: "player", col: 0, color: "--c-player", title: "Игрок", sub: "",
   d: `<p>Игрок. Обращения: «Имя игрока», «братан», «бро» (не «друг») — и не в каждой реплике.</p>`,
   kids: [
    { id: "p-talk", t: "Говорит голосом (F8)", s: "ok", d: `<p>Держит F8 и говорит — речь распознаёт Whisper, Гослинг отвечает. Речь игрока главнее: перебивает Гослинга.</p>` },
    { id: "p-read", t: "Читает книги и записки", s: "ok", d: `<p>Гослинг знает прочитанное («читал через плечо»): основной способ узнавать из книг.</p>` },
    { id: "p-give", t: "Отдаёт и забирает вещи", s: "ok", d: `<p>Обмен со спутником — Гослинг реагирует; отданную книгу читает сам.</p>` },
   ] },

 { id: "perc", col: 1, color: "--c-perc", title: "Восприятие: что Гослинг видит", sub: "companion/game/",
   d: `<p>Из событий плагина сервис держит состояние игры и собирает текст «Сейчас в игре» — на каждый запрос к модели заново.
   Частое и короткое — сразу в обстановке, редкое — справками по запросу (гибрид).</p>`,
   files: "state.py, places.py, profile.py, quests.py, geo.py, dialogue.py, books.py",
   kids: [
    { id: "pe-now", t: "«Сейчас в игре»", s: "ok", d: `<p>Место, время и погода, игрок (здоровье, уровень), бой, враги рядом и вдали, кто рядом,
      собеседник, сумка одной строкой, цели 3 заданий, «Недавно», «Ты слышал рядом», карточка текущего места, мысли, факты о месте.</p>` },
    { id: "pe-recent", t: "«Недавно» по важности", s: "ok", d: `<p>События с давностью («3 мин назад»); бой и стычки подряд — одной строкой
      («был бой с: Драугр — игрок убил: Драугр ×8»); важное (слово силы, задание, знакомый напал или убит) держится 30 мин.
      При загрузке сейва очищается — иначе «помнил» будущее (2026-10-15).</p>` },
    { id: "pe-heard", t: "«Ты слышал рядом»", s: "ok", d: `<p>Реплики NPC и то, что Игрок выбирал в разговоре («Игрок: «Кого вы ищете?»
      (выбрал в разговоре с …)») — выбор игрока берётся из файлов игры. 8 последних, за 5 минут.</p>` },
    { id: "pe-meet", t: "Встречи: «впервые» / «уже встречали»", s: "ok", d: `<p>Раса врага (у нелюдей) и применённый Крик: впервые — срочный повод
      («дракон: таких ты видишь впервые в жизни»), дальше — пометка «уже встречали 3 раза, последний — там-то».</p>` },
    { id: "pe-quests", t: "Задания", s: "ok", d: `<p>Новое задание, «цель выполнена», «новая цель», «задание завершено» — события.
      Текущие цели 3 заданий — в обстановке; весь журнал — справками.</p>` },
    { id: "pe-place", t: "Справка о месте", s: "ok", d: `<p>Из Skyrim.esm и DLC: тип места, владение, лавки, таверны, храмы, гильдии, замок и кто там
      живёт/работает (профессии — по фракциям). Карточка текущего поселения — в обстановке.</p>` },
    { id: "pe-profile", t: "Профиль Игрока", s: "new", d: `<p>Раса, уровень, лучшие навыки, гильдии с русскими званиями, розыск по владениям,
      пройденные крупные квесты, привычки по статистике («украдено 47»). Изменения — события («вступил в Соратники»).</p>` },
    { id: "pe-death", t: "Гибель и загрузка", s: "new", d: `<p>Погиб — Гослинг молчит, пока Игрок мёртв; что пошло не так (кто убил, где, что было
      перед этим) запоминается вне памяти по сейву; после загрузки — срочный повод: говорит прямо, с шуткой и советом.</p>` },
    { id: "pe-self", t: "Своё здоровье", s: "new", d: `<p>Плагин шлёт здоровье NPC Гослинга, «упал без сил» (спутника почти
      добили) и «мёртв». В обстановке — «Ты сам (Гослинг): здоровье 45%»; тяжело ранен (меньше 30%) или упал без сил —
      срочный повод, интерес 10 даже в бою: «Владос, я на земле, не могу встать! Держись, Мирмулнир прямо над тобой!»</p>` },
   ] },
 { id: "voice", col: 1, color: "--c-voice", title: "Голос и слух", sub: "companion/voice/",

 { id: "brain", col: 2, color: "--c-brain", title: "Мозг: заговорить ли самому", sub: "companion/brain.py",
   d: `<p>Говорить ли — решает модель: на любой повод пишет, что сказала бы, и ставит interest 0–10. Код только не даёт перебивать себя

    { id: "b-fresh", t: "Не перебивает и не опаздывает", s: "ok", d: `<p>Пока говорит — поводы ждут; обычный устаревает за 15 с, важный — за 45 с.

 { id: "think", col: 2, color: "--c-think", title: "Мыслитель", sub: "companion/memory/thinker.py",

 { id: "jokes", col: 2, color: "--c-jokes", title: "Шутки", sub: "companion/jokes.py",

 { id: "talk", col: 3, color: "--c-talk", title: "Разговор: модель", sub: "companion/llm.py",

 { id: "persona", col: 3, color: "--c-persona", title: "Личность", sub: "characters/gosling/prompt.md",

              "talk", "persona", "voice", "player", "mod", "game", "dev", "plan"];
const RX = 1700, RY = 1200, BOX_W = 440, HEAD = 78, ROW = 44, PAD = 16, PHOTO_R = 320;
const byId = {}, kidById = {};
for (const g of GROUPS) {
  g.w = BOX_W;
  g.h = HEAD + g.kids.length * ROW + PAD;
  byId[g.id] = g;
  g.kids.forEach((k, i) => { k.parent = g; k.i = i; kidById[k.id] = k; });
}
RING.forEach((id, i) => {
  const g = byId[id], a = -Math.PI / 2 + i * 2 * Math.PI / RING.length;

  <h3>Гослинг — агент, а не чат-бот</h3>
  <p>Он не ждёт вопроса: сам наблюдает за игрой, сам решает, заговорить ли, и сам вызывает инструменты, когда ему
  чего-то не хватает. Цикл:</p>
  <ol>
   <li><b>Видит</b> — плагин шлёт события игры; <a data-go="perc">восприятие</a> собирает «Сейчас в игре».</li>
   <li><b>Решает</b> — <a data-go="brain">мозг</a> на каждый повод спрашивает модель «стоит ли сказать» (interest 0–10);
     <a data-go="think">мыслитель</a> в фоне думает, что предложить Игроку.</li>
   <li><b>Отвечает</b> — <a data-go="talk">модель</a> получает <a data-go="persona">личность</a>, <a data-go="mem">память</a>,
     обстановку и историю; не хватает — вызывает <a data-go="tools">справки</a> (до 3 раз за ответ).</li>
   <li><b>Говорит</b> — <a data-go="voice">голос</a> XTTS с эмоцией, плагин произносит из уст NPC.</li>
   <li><b>Запоминает</b> — журнал, дневник <a data-go="diar">летописца</a>, факты, мысли, прочитанные книги.</li>
  </ol>

  <h3>Два пути реплики</h3>
  <p><b>Игрок спросил (F8):</b> Whisper → модель (параллельно — планировщик справок) → справки → ответ JSON (эмоция и
  текст) → голос. Модель ~2 с, первая фраза голоса ~1 с.</p>
  <p><b>Гослинг заговорил сам:</b> повод (событие, реплики NPC, тишина, мысль) → мозг собирает пачку (1,5 с) → модель
  пишет реплику и ставит interest → не ниже порога 6 — говорит (ниже — иногда шуткой) → сверка, не сменилась ли
  обстановка → голос. От повода до голоса ~5 с.</p>

  <h3>Инструменты (справки)</h3>
  <p>Модель вызывает их сама, по описанию инструмента: <code>find_places</code> (карта), <code>quests</code> и
  <code>quest_details</code> (журнал), <code>player_details</code> (сумка), <code>place_info</code> (любое место),
  <code>world_info</code> (знания о мире и прочитанное). Отдельный быстрый запрос без истории — планировщик — заранее
  решает, какие справки нужны: с историей модель «обещала посмотреть» и не смотрела. Поведение правим описаниями
  инструментов, а не промптом персонажа.</p>

   <tr><td><b>Whisper large-v3-turbo</b></td><td>локально, видеокарта</td><td>распознавание речи Игрока</td></tr>
   <tr><td><b>XTTS-v2</b></td><td>локально, видеокарта</td><td>голос Эрика, эмоции — по референсам из диалогов игры</td></tr>
   <tr><td><b>LipGenerator</b></td><td>локально (из Creation Kit)</td><td>движение губ (.lip) к каждой фразе — не нейросеть</td></tr>
  </table>
  <p>Знания о мире — не модель, а поиск (SQLite FTS5) по данным игры: экраны загрузки, люди, места, прочитанные книги.
  Настройки моделей — <code>config.yaml</code> (<code>llm</code>, <code>stt</code>, <code>tts</code>, <code>jokes</code>),
  ключ — <code>config.local.yaml</code>.</p>
  <div class="files">Точка входа в логах: production_logs/2026-10-14_итоги_и_план.md; план памяти — 2026-10-15_план_памяти.md</div>` };

// ------------------------------------------------------------------ рисование
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const statusColor = s => ({ ok: "var(--ok)", new: "var(--new)", plan: "var(--plan)" })[s];
const statusText = s => ({ ok: "работает в игре", new: "сделано, в игре не проверено", plan: "в планах" })[s];

const gGroups = document.getElementById("groups"), gEdges = document.getElementById("edges");
for (const g of GROUPS) {
  const wrap = el("g", { "data-group": g.id, style: `--block: var(${g.color})` }, gGroups);
  el("rect", { class: "grp-rect", x: g.x, y: g.y, width: g.w, height: g.h, rx: 16, "data-id": g.id }, wrap);
  el("rect", { x: g.x, y: g.y, width: g.w, height: 10, rx: 5, fill: `var(${g.color})`, "pointer-events": "none" }, wrap);
  const t = el("text", { class: "grp-title", x: g.x + 20, y: g.y + 40 }, wrap); t.textContent = g.title;
  const s = el("text", { class: "grp-sub", x: g.x + 20, y: g.y + 62 }, wrap); s.textContent = g.sub;
  g.kids.forEach((k, i) => {
    const y = g.y + HEAD + i * ROW;
    const c = el("g", { class: "chip" + (k.s === "plan" ? " plan" : ""), "data-id": k.id }, wrap);
    el("rect", { x: g.x + 14, y, width: g.w - 28, height: ROW - 8, rx: 9 }, c);
    el("circle", { cx: g.x + 32, cy: y + (ROW - 8) / 2, r: 5.5, fill: k.s === "plan" ? "none" : statusColor(k.s),
      stroke: statusColor(k.s), "stroke-width": k.s === "plan" ? 1.8 : 0, "stroke-dasharray": k.s === "plan" ? "2 2" : "" }, c);
    const kt = el("text", { x: g.x + 46, y: y + (ROW - 8) / 2 + 5 }, c); kt.textContent = k.t;
  });
}

// Центр: фото в круге и подпись.
{
  const c = el("g", { class: "center", "data-id": "center" }, document.getElementById("center"));
  const defs = document.querySelector("defs");
  const clip = el("clipPath", { id: "photoClip" }, defs);
  el("circle", { cx: 0, cy: 0, r: PHOTO_R }, clip);
  el("circle", { class: "center-halo", cx: 0, cy: 0, r: PHOTO_R + 16 }, c);
  el("image", { href: PHOTO, x: -PHOTO_R, y: -PHOTO_R, width: PHOTO_R * 2, height: PHOTO_R * 2,
    "clip-path": "url(#photoClip)", preserveAspectRatio: "xMidYMid slice" }, c);
  el("circle", { class: "center-ring", cx: 0, cy: 0, r: PHOTO_R }, c);
  const t = el("text", { class: "center-title", x: 0, y: PHOTO_R + 80, "text-anchor": "middle" }, c); t.textContent = "Гослинг";
  const st = el("text", { class: "center-sub", x: 0, y: PHOTO_R + 116, "text-anchor": "middle" }, c); st.textContent = CENTER.sub;
}

// Связи: из края одного блока к краю другого, кривой Безье; подпись — в середине. Если прямая прошла бы через
// фото в центре — кривая огибает его снаружи.
function anchor(g, toward) {
  const cx = g.x + g.w / 2, cy = g.y + g.h / 2, dx = toward.x - cx, dy = toward.y - cy;
  if (Math.abs(dx) * g.h > Math.abs(dy) * g.w) {
    const side = dx > 0 ? 1 : -1;
    return { x: cx + side * g.w / 2, y: Math.max(g.y + 30, Math.min(g.y + g.h - 30, cy + dy * 0.25)), nx: side, ny: 0 };
  }
  const side = dy > 0 ? 1 : -1;
  return { x: Math.max(g.x + 40, Math.min(g.x + g.w - 40, cx + dx * 0.25)), y: cy + side * g.h / 2, nx: 0, ny: side };
}
function segDist(a, b) {  // расстояние от центра (0,0) до отрезка ab
  const dx = b.x - a.x, dy = b.y - a.y, t = Math.max(0, Math.min(1, -(a.x * dx + a.y * dy) / (dx * dx + dy * dy)));
  return Math.hypot(a.x + t * dx, a.y + t * dy);
}
const edgeEls = [];
EDGES.forEach(([a, b, label], i) => {
  const A = byId[a], B = byId[b];
  const ca = { x: A.x + A.w / 2, y: A.y + A.h / 2 }, cb = { x: B.x + B.w / 2, y: B.y + B.h / 2 };
  const pa = anchor(A, cb), pb = anchor(B, ca);
  const reverse = EDGES.some(([x, y]) => x === b && y === a);  // встречные связи — разводим
  const off = reverse ? (a < b ? 18 : -18) : 0;
  const k = Math.max(70, Math.hypot(pb.x - pa.x, pb.y - pa.y) * 0.35);
  let p1 = { x: pa.x + pa.nx * k + (pa.ny ? off : 0), y: pa.y + pa.ny * k + (pa.nx ? off : 0) };
  let p2 = { x: pb.x + pb.nx * k + (pb.ny ? off : 0), y: pb.y + pb.ny * k + (pb.nx ? off : 0) };
  const sa = { x: pa.x + (pa.ny ? off : 0), y: pa.y + (pa.nx ? off : 0) }, sb = { x: pb.x + (pb.ny ? off : 0), y: pb.y + (pb.nx ? off : 0) };
  if (segDist(sa, sb) < PHOTO_R + 120) {  // через фото — огибаем: обе опоры кривой — снаружи круга, со стороны середины
    const m = { x: (sa.x + sb.x) / 2, y: (sa.y + sb.y) / 2 }, len = Math.hypot(m.x, m.y);
    const n = len > 40 ? { x: m.x / len, y: m.y / len } : (() => { const d = Math.hypot(sb.x - sa.x, sb.y - sa.y);
      return { x: -(sb.y - sa.y) / d, y: (sb.x - sa.x) / d }; })();
    const q = { x: n.x * (PHOTO_R + 560), y: n.y * (PHOTO_R + 560) };
    p1 = { x: sa.x + (q.x - sa.x) * 0.75, y: sa.y + (q.y - sa.y) * 0.75 };
    p2 = { x: sb.x + (q.x - sb.x) * 0.75, y: sb.y + (q.y - sb.y) * 0.75 };
  }
  const path = el("path", { class: "edge", d: `M${sa.x},${sa.y} C${p1.x},${p1.y} ${p2.x},${p2.y} ${sb.x},${sb.y}`,
    "marker-end": "url(#arrow)" }, gEdges);
  const mid = { x: 0.125 * sa.x + 0.375 * p1.x + 0.375 * p2.x + 0.125 * sb.x, y: 0.125 * sa.y + 0.375 * p1.y + 0.375 * p2.y + 0.125 * sb.y };
  const bg = el("rect", { class: "edge-label-bg", rx: 5 }, gEdges);
  const t = el("text", { class: "edge-label", x: mid.x, y: mid.y + 4, "text-anchor": "middle" }, gEdges);
  t.textContent = label;
  const box = t.getBBox();
  bg.setAttribute("x", box.x - 6); bg.setAttribute("y", box.y - 3);
  bg.setAttribute("width", box.width + 12); bg.setAttribute("height", box.height + 6);
  edgeEls.push({ a, b, path, t, bg });
});

// ------------------------------------------------------------------ панорама и зум
const svg = document.getElementById("canvas"), world = document.getElementById("world");
let view = { x: 0, y: 0, k: 1 };
const apply = () => world.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
const bounds = () => {
  const xs = GROUPS.map(g => g.x), ys = GROUPS.map(g => g.y);  // центр (0,0) — внутри кольца
  return { x: Math.min(...xs) - 30, y: Math.min(...ys) - 30,
    w: Math.max(...GROUPS.map(g => g.x + g.w)) - Math.min(...xs) + 60,
    h: Math.max(...GROUPS.map(g => g.y + g.h)) - Math.min(...ys) + 60 };
};
function viewFor(r, pad = 40) {
  const W = svg.clientWidth, H = svg.clientHeight, top = 64;
  const right = panel.classList.contains("open") && W > 700 ? Math.min(460, W * 0.45) : 0;
  const bottom = panel.classList.contains("open") && W <= 700 ? H * 0.55 : 0;
  const aw = W - right - pad * 2, ah = H - top - bottom - pad * 2;
  const k = Math.max(0.08, Math.min(2.2, Math.min(aw / r.w, ah / r.h)));
  return { k, x: pad + (aw - r.w * k) / 2 - r.x * k, y: top + pad + (ah - r.h * k) / 2 - r.y * k };
}
let anim = null;
function animateTo(target, ms = 380) {
  cancelAnimationFrame(anim);
  const from = { ...view }, t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / ms), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    view = { x: from.x + (target.x - from.x) * e, y: from.y + (target.y - from.y) * e, k: from.k + (target.k - from.k) * e };
    apply();
    if (p < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
const fit = () => animateTo(viewFor(bounds()));
function zoomAt(factor, cx, cy) {
  const k = Math.max(0.08, Math.min(4, view.k * factor));
  view = { k, x: cx - (cx - view.x) * (k / view.k), y: cy - (cy - view.y) * (k / view.k) };
  apply();
}
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

// Перетаскивание (мышь, палец) и щипок двумя пальцами; клик — если почти не двигали.
const pointers = new Map();
let drag = null, pinch = null;
svg.addEventListener("pointerdown", e => {
  e.preventDefault();  // иначе браузер начинает выделять текст страницы, пока тащим карту
  document.getSelection().removeAllRanges();
  document.body.classList.add("dragging-map");
  svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false, target: e.target };
  if (pointers.size === 2) {
    const [p, q] = [...pointers.values()];
    pinch = { d: Math.hypot(p.x - q.x, p.y - q.y), k: view.k };
    drag = null;
  }
});
svg.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) {
    const [p, q] = [...pointers.values()], r = svg.getBoundingClientRect();
    const d = Math.hypot(p.x - q.x, p.y - q.y);
    zoomAt((pinch.k * d / pinch.d) / view.k, (p.x + q.x) / 2 - r.left, (p.y + q.y) / 2 - r.top);
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { drag.moved = true; svg.classList.add("dragging"); }
  if (drag.moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; apply(); }
});
const endPointer = e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (drag && !drag.moved && e.type === "pointerup") clickAt(drag.target);
  if (pointers.size === 0) drag = null;
  svg.classList.remove("dragging");
  if (pointers.size === 0) document.body.classList.remove("dragging-map");
};
svg.addEventListener("pointerup", endPointer);
svg.addEventListener("pointercancel", endPointer);
// Приближение — только по двойному клику; одинарный открывает подробности, не трогая масштаб. Двойной клик ловим сами
// (два клика по одному и тому же за DOUBLE_MS): preventDefault при нажатии гасит у браузера событие dblclick.
const DOUBLE_MS = 350;
let lastClick = { id: null, at: 0 };
function zoomTo(id) {
  if (id === "center") zoomToCenter();
  else if (id) zoomToGroup(byId[id] || kidById[id].parent);
}

const idOf = t => { const n = t.closest && t.closest("[data-id]"); return n ? n.getAttribute("data-id") : null; };
function clickAt(target) {
  const id = idOf(target), now = performance.now();
  const double = id && lastClick.id === id && now - lastClick.at < DOUBLE_MS;
  lastClick = { id: double ? null : id, at: now };
  if (!id) { select(null); return; }
  if (selected !== id) select(id);
  if (double) zoomTo(id);
}

// ------------------------------------------------------------------ выбор и панель
const panel = document.getElementById("panel"), body = document.getElementById("panelBody");
let selected = null;
function zoomToCenter() {
  animateTo(viewFor({ x: -PHOTO_R - 60, y: -PHOTO_R - 60, w: 2 * PHOTO_R + 120, h: 2 * PHOTO_R + 200 }, 30));
}
function zoomToGroup(g) {
  animateTo(viewFor({ x: g.x - 20, y: g.y - 20, w: g.w + 40, h: g.h + 40 }, 30));
}
function select(id) {
  document.querySelectorAll(".selected").forEach(n => n.classList.remove("selected"));
  edgeEls.forEach(e => { e.path.classList.remove("hl", "dim"); e.t.classList.remove("hl-label", "dim"); e.bg.classList.remove("dim");
    e.path.setAttribute("marker-end", "url(#arrow)"); });
  document.querySelectorAll("[data-group]").forEach(n => n.classList.remove("dim"));
  selected = id;
  if (!id) { panel.classList.remove("open"); return; }
  if (id === "center") {
    body.innerHTML = `<h2>${CENTER.title}</h2><div class="path">${CENTER.sub}</div>${CENTER.d}
      <div class="kids"><b>Из чего он состоит</b><br>${GROUPS.map(g => `<button data-go="${g.id}">${g.title}</button>`).join("")}</div>`;
    body.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
      const to = b.getAttribute("data-go"); select(to); zoomToGroup(byId[to]); }));
    body.scrollTop = 0;
    panel.classList.add("open");
    return;
  }
  const g = byId[id] || kidById[id].parent, kid = kidById[id];
  const node = document.querySelector(`[data-id="${id}"]`);
  (kid ? node.querySelector("rect") : node).classList.add("selected");
  const linked = new Set([g.id]);
  edgeEls.forEach(e => {
    const on = e.a === g.id || e.b === g.id;
    if (on) { e.path.classList.add("hl"); e.t.classList.add("hl-label"); e.path.setAttribute("marker-end", "url(#arrow-hl)"); linked.add(e.a); linked.add(e.b); }
    else { e.path.classList.add("dim"); e.t.classList.add("dim"); e.bg.classList.add("dim"); }
  });
  document.querySelectorAll("[data-group]").forEach(n => { if (!linked.has(n.getAttribute("data-group"))) n.classList.add("dim"); });
  body.innerHTML = kid ? kidHtml(kid) : groupHtml(g);
  body.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
    const to = b.getAttribute("data-go");
    select(to);
    if (byId[to]) zoomToGroup(byId[to]);
  }));
  panel.classList.add("open");
}
const links = g => {
  const out = EDGES.filter(([a]) => a === g.id).map(([, b, l]) => `→ <a data-go="${b}">${byId[b].title}</a>: ${l}`);
  const inn = EDGES.filter(([, b]) => b === g.id).map(([a, , l]) => `← <a data-go="${a}">${byId[a].title}</a>: ${l}`);
  return out.length + inn.length ? `<div class="links"><b>Связи</b><br>${[...out, ...inn].join("<br>")}</div>` : "";
};
const counts = g => {
  const c = { ok: 0, new: 0, plan: 0 }; g.kids.forEach(k => c[k.s]++);
  return Object.entries(c).filter(([, n]) => n).map(([s, n]) =>
    `<span class="status" style="border-color:${statusColor(s)}"><span class="dot" style="background:${statusColor(s)}"></span>${statusText(s)}: ${n}</span>`).join(" ");
};
function groupHtml(g) {
  return `<h2 style="border-left:6px solid var(${g.color});padding-left:10px">${g.title}</h2><div class="path">${g.sub || "&nbsp;"}</div>${counts(g)}${g.d}
    <div class="kids"><b>Части</b><br>${g.kids.map(k => `<button data-go="${k.id}">
      <span class="dot" style="background:${k.s === "plan" ? "transparent" : statusColor(k.s)};${k.s === "plan" ? "border:1.5px dashed var(--plan)" : ""}"></span>${k.t}</button>`).join("")}</div>
    ${g.files ? `<div class="files">Файлы: ${g.files}</div>` : ""}${links(g)}`;
}
function kidHtml(k) {
  const g = k.parent;
  return `<h2 style="border-left:6px solid var(${g.color});padding-left:10px">${k.t}</h2><div class="path"><a data-go="${g.id}" style="color:var(--sel);cursor:pointer">${g.title}</a></div>
    <span class="status" style="border-color:${statusColor(k.s)}"><span class="dot" style="background:${k.s === "plan" ? "transparent" : statusColor(k.s)}"></span>${statusText(k.s)}</span>
    ${k.d}${g.files ? `<div class="files">Файлы блока: ${g.files}</div>` : ""}`;
}

// ------------------------------------------------------------------ кнопки, поиск, тема
const center = () => ({ x: svg.clientWidth / 2, y: svg.clientHeight / 2 });
document.getElementById("zoomIn").onclick = () => { const c = center(); zoomAt(1.3, c.x, c.y); };
document.getElementById("zoomOut").onclick = () => { const c = center(); zoomAt(1 / 1.3, c.x, c.y); };
document.getElementById("fit").onclick = () => { select(null); fit(); };
document.getElementById("close").onclick = () => select(null);
document.getElementById("about").onclick = () => select("center");
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Escape") { select(null); fit(); }
  if (e.key === "+" || e.key === "=") { const c = center(); zoomAt(1.3, c.x, c.y); }
  if (e.key === "-") { const c = center(); zoomAt(1 / 1.3, c.x, c.y); }
});
const search = document.getElementById("search");
search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  document.querySelectorAll(".match").forEach(n => n.classList.remove("match"));
  if (q.length < 2) return;
  const hits = [];
  for (const g of GROUPS) {
    if ((g.title + " " + g.sub + " " + g.d).toLowerCase().includes(q)) hits.push(g.id);
    for (const k of g.kids) if ((k.t + " " + k.d).toLowerCase().includes(q)) {
      hits.push(k.id); document.querySelector(`[data-id="${k.id}"]`).classList.add("match");
    }
  }
  const first = hits.find(id => kidById[id]) || hits[0];
  if (first) { const g = byId[first] || kidById[first].parent; zoomToGroup(g); }
});
search.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const m = document.querySelector(".match");
  if (m) select(m.getAttribute("data-id"));
});
const root = document.documentElement;
try { const saved = localStorage.getItem("gosling-theme"); if (saved) root.dataset.theme = saved; } catch (e) {}
document.getElementById("theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("gosling-theme", root.dataset.theme); } catch (e) {}
};
window.addEventListener("resize", () => { if (!selected) view = viewFor(bounds()), apply(); });

view = viewFor(bounds());
apply();
