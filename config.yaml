# Настройки голосового сервиса. Пути — относительно корня проекта.

models_dir: models
logs_dir: logs       # трасса Гослинга — logs/trace/<дата>.log: вопросы, справки и ответы модели, озвучка, летописец
trace: true

# Персонаж: папка в characters/ — prompt.md (личность) и voice/<эмоция>/*.wav (голос).
character: gosling

server:
  host: 127.0.0.1
  port: 8765

push_to_talk:
  enabled: true
  # Имя клавиши pynput: f1..f12, alt_r, ctrl_r, shift_r, caps_lock ... или символ: "v", "b"
  # F5/F9 в Скайриме — быстрое сохранение/загрузка, их не занимаем.
  key: f8
  min_duration: 0.3   # секунды; более короткие нажатия игнорируются

# true — без LLM: распознанная фраза просто озвучивается обратно (проверка голоса).
# false — отвечает LLM (секция llm ниже).
echo: false

audio:
  input_device: null    # null — устройство Windows по умолчанию; номер или часть имени
  output_device: null
  sample_rate: 16000    # частота записи (Whisper ждёт 16 кГц)

stt:
  model: large-v3-turbo # папка в models/whisper/ (small — быстрее и легче, но ошибается чаще)
  device: cuda          # cuda | cpu  (на GPU в ~12 раз быстрее, +~0.4 ГБ VRAM для small)
  compute_type: int8_float16   # cuda: int8_float16 или float16; cpu: int8
  language: ru
  beam_size: 5
  vad_filter: true      # отсекает тишину и убирает «галлюцинации» на шуме
  # Словарь-подсказка: Whisper охотнее пишет эти слова правильно. Дополняй по ходу игры.
  initial_prompt: >-
    Скайрим, Вайтран, Маркарт, Солитьюд, Виндхельм, Рифтен, Ту'ум, двемеры,
    Довакин, тан, Ульфрик Буревестник, драугр, Совнгард, Лидия, хускарл, Гослинг.

tts:
  model: XTTS-v2        # папка в models/xtts/
  device: cuda          # cuda | cpu (на CPU в разы медленнее реального времени)
  language: ru
  temperature: 0.7      # выше — живее и разнообразнее, но больше риск оговорок
  speed: 1.2            # темп речи: 1.0 у Эрика звучит медленно; 1.1–1.3 — живее (образцы: recordings/speed_test)
  stream: true          # озвучивать по мере синтеза: звук начинается раньше
  stream_chunk_size: 20 # меньше — раньше первый звук, но больше накладных расходов
  stream_prebuffer: 0.5 # секунд звука копится до старта: больше — ровнее речь, но позже начало

llm:
  # Любой сервер с OpenAI-совместимым API:
  #   LM Studio   http://localhost:1234/v1   (вкладка Developer -> Start Server)
  #   Ollama      http://localhost:11434/v1
  #   OpenRouter  https://openrouter.ai/api/v1   (нужен ключ)
  base_url: https://openrouter.ai/api/v1
  model: anthropic/claude-haiku-5.5 # имя модели на сервере (LM Studio показывает его в Developer)
  # Фоновые запросы (летописец: дневник, факты, цели) — их никто не ждёт, а записанное потом долго возвращается
  # в промпт, поэтому модель посильнее (~1,3 цента за главу). Пусто — та же, что model.
  background_model: anthropic/claude-sonnet-5.5
  # Sonnet 5.5 на OpenRouter без «размышлений» не работает (400: reasoning is mandatory) — оставляем, но
  # низкой интенсивности; они считаются в background_max_tokens. Для фоновой Haiku — убрать (возьмётся extra_body).
  background_extra_body: {reasoning: {effort: low}}
  background_max_tokens: 4000
  # api_key — в config.local.yaml (не в git), или переменная окружения ниже
  api_key_env: LLM_API_KEY  # имя переменной окружения с ключом; локальным серверам не нужен
  temperature: 0.6     # выше — живее, но больше выдумок (лор, имена)
  max_tokens: 500      # потолок длины ответа; обычный ответ ~80 токенов, платим только за сгенерированное
  history_turns: 10     # сколько последних обменов репликами помнит
  tools: true          # справки по запросу модели (места на карте, позже квесты, память)
  max_tool_rounds: 3   # сколько раз за ответ можно обратиться к справкам
  # Планировщик справок: на реплику игрока параллельно идёт короткий запрос без истории разговора — какие справки
  # нужны. С историей модель часто обещает «сейчас гляну» и не смотрит; без истории — смотрит. Ответ не замедляет.
  tool_router: true
  json_mode: false      # true — просить сервер строго JSON (поддерживают не все)
  timeout: 60
  # Доп. поля запроса, свои у каждого сервера. OpenRouter: отключаем «размышления» модели —
  # иначе они съедают max_tokens (ответ обрывается или пустой) и добавляют 1–2 с задержки.
  # Для LM Studio / Ollama — убрать (extra_body: {}).
  extra_body: {reasoning: {enabled: false}}

# Игра: папка Data — оттуда сервис читает строки игры (тексты журнала квестов). Только чтение.
game:
  data_dir: D:\Steam\steamapps\common\Skyrim Special Edition\Data

# Голос из уст Гослинга в игре (нужен мод Gosling — tools/build_gosling_esp.py --install).
# Если Гослинг рядом — звук идёт из него (объёмный, с анимацией речи), иначе — из колонок.
npc_voice:
  enabled: true
  mod_dir: D:\Games\Modding\MO2\mods\Gosling
  max_distance: 30    # метров: дальше — через колонки
  max_chars: 120      # длина фразы: короче — раньше звучит первая
  gap: 0.3            # пауза между фразами, с
  lip: true           # губы: .lip к каждой фразе (генератор из комплекта Creation Kit), +~0,3 с к первой фразе

# Ориентация: что Гослинг знает о карте вокруг. Видит только открытое игроком на карте,
# плюс неоткрытое совсем рядом — без названия, только тип («какая-то пещера в 400 м на север»).
map:
  known_count: 5        # сколько ближайших открытых мест называть
  unknown_radius: 1000  # метров: неоткрытое ближе этого — замечает
  unknown_count: 3

# Мозг: когда Гослинг заговаривает сам (события в игре, долгая тишина). Нужна LLM (echo: false).
brain:
  enabled: true
  # Говорить ли самому — решает модель: на каждый повод (событие, подслушанное, долгая тишина) пишет, что сказала
  # бы, и ставит interest 0–10 (0–2 обыденное, 3–4 незачем, 5–6 можно и промолчать, 7–8 важно вам, 9–10 нельзя
  # промолчать); видит, когда и что говорила сама и идёт ли бой. Гослинг говорит, если оценка не ниже interest.
  # Меньше — болтливее (6: и «есть что сказать к месту»), больше — молчаливее (9: только опасность и впервые увиденное).
  interest: 6
  # Неважное (ниже interest) модель пишет короткой шуткой к месту (до 10 слов; заготовки к обстановке — из
  # characters/gosling/jokes.yaml); с этим шансом шутка всё же звучит — не в бою и не раньше quip_gap секунд после
  # прошлой шутки Гослинга. 0 — не шутить.
  quip_chance: 0.2  # 0 — не шутить, 0.5 — каждый второй неважный повод
  quip_gap: 30      # секунд после его прошлой шутки (не любой реплики), раньше не шутит
  ask_gap: 2          # секунд между вопросами модели (пока говорит или отвечает игроку — поводы ждут его)
  settle: 1.5         # секунд собрать связанные события в одну пачку (вошли в город + сменилось помещение)
  idle_after: 30     # столько секунд тишины — и спросить модель, не заговорить ли
  # Пока Гослинг говорит или отвечает, поводы ждут; старше этого — уже не про то, что сейчас (модель не спрашиваем).
  # А готовую реплику по своей инициативе не говорит, если пока думал, сменились место, помещение или бой.
  fresh_for: 15        # секунд — обычный повод (вошли в помещение, сундук); подслушанное — HEARD_MAX_AGE в brain.py
  fresh_important: 45  # секунд — важный (задание, знакомый, впервые увиденное, Крик, тяжело ранен)
  # Какие события показывать модели: loaded (загрузка сейва), location (новая локация), wilderness (ушли в дикие
  # земли), interior (вошли в помещение), combat_started, combat_ended, low_health, item (подобрал с земли),
  # discovered (новое место на карте), profile (гильдия, звание, крупный квест, розыск), power (слово силы, душа
  # дракона, Крик), person (знакомый NPC напал, убегает или убит), quest / quest_misc (задания и мелкие
  # поручения), cleared (подземелье зачищено), crime, talk (уговорил/подкупил/запугал), deed (взлом, заклинание),
  # activated (рычаг, столб загадки), unlocked (отпер ключом), reading (Владос читает книгу), looted (сундук, тело),
  # furniture (верстак, кровать), novel (впервые видите такое существо), threat (вдали враг-нелюдь),
  # gift (Владос отдал тебе вещи или забрал; отданную книгу ты читаешь),
  # thought (мысль, которую мыслитель велел сказать сейчас, — говорит без оценки; мысли «при случае» —
  # на долгую тишину), died (Владос погиб и загрузил сохранение — вместо loaded).
  # Нет в списке — только в «Недавно» (killed: убитые враги — в сводке боя; talked: заговорил с NPC).
  # Пока Владос мёртв (до загрузки), Гослинг сам не заговаривает.
  events: [loaded, location, wilderness, interior, combat_started, combat_ended, low_health, item, discovered, profile,
           power, person, quest, quest_misc, cleared, crime, talk, deed, activated, unlocked, reading, looted, furniture,
           novel, threat, thought, died, gift]
  overheard_quiet: 3  # секунд без новых реплик NPC — разговор закончился, можно решать (и игрок вышел из меню разговора)

# Летописец: по журналу пишет дневник, факты и цели (фоновая модель llm.background_model). Глава кончилась, когда:
# ушли из места и записей не меньше min_entries; или big_dialogue реплик / big_total записей; или chapter_seconds
# с первой неописанной записи (и записей не меньше min_entries).
diarist:
  min_entries: 6
  big_dialogue: 20
  big_total: 60          # в городе подслушанное копится быстро
  chapter_seconds: 900   # 15 минут
  check_every: 30        # секунд — как часто проверять
  max_heard: 20          # подслушанного в запрос — последних
  max_lines: 120         # строк журнала в запрос
  known_facts: 40        # уже известных фактов в запрос (чтобы не повторялся)

# Мысли Гослинга: фоновая модель (llm.background_model) решает, что ему держать в голове и предложить («продать
# железо Белетору — он рядом»); новая мысль, которую стоит сказать, — повод заговорить. Думает при смене поселения,
# заданий или сумки (на bag_change вещей), не чаще min_gap; без перемен — раз в quiet_every. ~1,5–2 цента за раздумье.
thinker:
  enabled: true
  min_gap: 30           # секунд между раздумьями (вошли в город и сразу в лавку — одно раздумье)
  quiet_every: 600       # секунд — подумать и без перемен
  bag_change: 30          # вещей в сумке прибавилось или убыло — повод подумать
  check_every: 3         # секунд — как часто смотреть, не поменялось ли что (проверка дешёвая, без модели)
  max_ideas: 3
  dialogue_lines: 12     # последних реплик в запрос — что уже предлагал и что ответил Владос

# Шутки (companion/jokes.py): к поводу заговорить мозг даёт модели 3–4 заготовки к обстановке из
# characters/gosling/jokes.yaml (+ jokes_auto.yaml) и 0–2 строки вашей общей истории (гибели, привычки); сказанное
# помнит (по сейву). Файлы шуток перечитываются на лету — правь, не перезапуская.
jokes:
  enabled: true
  # Несказанных заготовок к обстановке меньше refill_below — сильная модель в фоне дописывает refill_count новых
  # (в jokes_auto.yaml, с пометкой new: true — просмотреть), не чаще раза в refill_gap секунд.
  refill: true
  refill_below: 2
  refill_count: 6
  refill_gap: 900
  model: anthropic/claude-sonnet-5.5  # почти как Opus, вдвое дешевле (~1,4 цента за пополнение)

# Окно с логом поверх игры: то же, что в консоли start.bat, — не сворачивая Скайрим. Клики проходят сквозь него,
# фокус у игры не забирает. Видно только в окне без рамки: SkyrimPrefs.ini (в профиле MO2) — bFull Screen=0,
# bBorderless=1; поверх эксклюзивного полного экрана Windows ничего не рисует.
overlay:
  enabled: true
  key: f10             # показать / спрятать
  visible: false       # показано сразу при запуске
  corner: top-right    # top-right | top-left | bottom-right | bottom-left
  width: 760
  height: 380
  alpha: 0.8           # непрозрачность 0..1
  font_size: 10
