# Настройки голосового сервиса. Пути — относительно корня проекта.

models_dir: models

# Персонаж: папка в characters/ — prompt.md (личность) и voice/<эмоция>/*.wav (голос).
character: gosling

server:
  host: 127.0.0.1
  port: 8765

push_to_talk:
  enabled: true
  # Имя клавиши pynput: f1..f12, alt_r, ctrl_r, shift_r, caps_lock ... или символ: "v", "b"
  # F5/F9 в Скайриме — быстрое сохранение/загрузка, их не занимаем.
  key: f8
  min_duration: 0.3   # секунды; более короткие нажатия игнорируются

# true — без LLM: распознанная фраза просто озвучивается обратно (проверка голоса).
# false — отвечает LLM (секция llm ниже).
echo: false

audio:
  input_device: null    # null — устройство Windows по умолчанию; номер или часть имени
  output_device: null
  sample_rate: 16000    # частота записи (Whisper ждёт 16 кГц)

stt:
  model: large-v3-turbo # папка в models/whisper/ (small — быстрее и легче, но ошибается чаще)
  device: cuda          # cuda | cpu  (на GPU в ~12 раз быстрее, +~0.4 ГБ VRAM для small)
  compute_type: int8_float16   # cuda: int8_float16 или float16; cpu: int8
  language: ru
  beam_size: 5
  vad_filter: true      # отсекает тишину и убирает «галлюцинации» на шуме
  # Словарь-подсказка: Whisper охотнее пишет эти слова правильно. Дополняй по ходу игры.
  initial_prompt: >-
    Скайрим, Вайтран, Маркарт, Солитьюд, Виндхельм, Рифтен, Ту'ум, двемеры,
    Довакин, тан, Ульфрик Буревестник, драугр, Совнгард, Лидия, хускарл, Гослинг.

tts:
  model: XTTS-v2        # папка в models/xtts/
  device: cuda          # cuda | cpu (на CPU в разы медленнее реального времени)
  language: ru
  temperature: 0.7      # выше — живее и разнообразнее, но больше риск оговорок
  speed: 1.0            # темп речи
  stream: true          # озвучивать по мере синтеза: звук начинается раньше
  stream_chunk_size: 20 # меньше — раньше первый звук, но больше накладных расходов
  stream_prebuffer: 0.5 # секунд звука копится до старта: больше — ровнее речь, но позже начало

llm:
  # Любой сервер с OpenAI-совместимым API:
  #   LM Studio   http://localhost:1234/v1   (вкладка Developer -> Start Server)
  #   Ollama      http://localhost:11434/v1
  #   OpenRouter  https://openrouter.ai/api/v1   (нужен ключ)
  base_url: https://openrouter.ai/api/v1
  model: anthropic/claude-haiku-5.5 # имя модели на сервере (LM Studio показывает его в Developer)
  # api_key — в config.local.yaml (не в git), или переменная окружения ниже
  api_key_env: LLM_API_KEY  # имя переменной окружения с ключом; локальным серверам не нужен
  temperature: 0.6     # выше — живее, но больше выдумок (лор, имена)
  max_tokens: 500      # потолок длины ответа; обычный ответ ~80 токенов, платим только за сгенерированное
  history_turns: 10     # сколько последних обменов репликами помнит
  tools: true          # справки по запросу модели (места на карте, позже квесты, память)
  max_tool_rounds: 3   # сколько раз за ответ можно обратиться к справкам
  json_mode: false      # true — просить сервер строго JSON (поддерживают не все)
  timeout: 60
  # Доп. поля запроса, свои у каждого сервера. OpenRouter: отключаем «размышления» модели —
  # иначе они съедают max_tokens (ответ обрывается или пустой) и добавляют 1–2 с задержки.
  # Для LM Studio / Ollama — убрать (extra_body: {}).
  extra_body: {reasoning: {enabled: false}}

# Игра: папка Data — оттуда сервис читает строки игры (тексты журнала квестов). Только чтение.
game:
  data_dir: D:\Steam\steamapps\common\Skyrim Special Edition\Data

# Голос из уст Гослинга в игре (нужен мод Gosling — tools/build_gosling_esp.py --install).
# Если Гослинг рядом — звук идёт из него (объёмный, с анимацией речи), иначе — из колонок.
npc_voice:
  enabled: true
  mod_dir: D:\Games\Modding\MO2\mods\Gosling
  max_distance: 30    # метров: дальше — через колонки
  max_chars: 120      # длина фразы: короче — раньше звучит первая
  gap: 0.3            # пауза между фразами, с
  lip: true           # губы: .lip к каждой фразе (генератор из комплекта Creation Kit), +~0,3 с к первой фразе

# Ориентация: что Гослинг знает о карте вокруг. Видит только открытое игроком на карте,
# плюс неоткрытое совсем рядом — без названия, только тип («какая-то пещера в 400 м на север»).
map:
  known_count: 5        # сколько ближайших открытых мест называть
  unknown_radius: 1000  # метров: неоткрытое ближе этого — замечает
  unknown_count: 3

# Мозг: когда Гослинг заговаривает сам (события в игре, долгая тишина). Нужна LLM (echo: false).
brain:
  enabled: true
  min_gap: 60         # секунд между репликами по своей инициативе
  urgent_gap: 20      # то же, если игрок тяжело ранен
  idle_after: 180     # столько секунд тишины — и может заговорить сам
  idle_chance: 0.5    # шанс, что заговорит, когда тишина затянулась
  # Шанс прокомментировать событие: loaded (загрузка сейва), location (новая локация),
  # wilderness (ушли в дикие земли), interior (вошли в помещение), combat_ended, low_health,
  # item (подобрал с земли), discovered (на карте появилось новое место),
  # overheard (NPC рядом что-то сказали — встревать ли, решает сама модель). Нет в списке — молчит.
  chances: {loaded: 1.0, location: 1.0, wilderness: 0.5, interior: 0.6, combat_ended: 0.7, low_health: 1.0, item: 0.3, discovered: 0.8, overheard: 0.8}
  overheard_quiet: 4  # секунд без новых реплик NPC — разговор закончился, можно решать (и игрок вышел из меню разговора)
  overheard_gap: 20   # секунд между решениями «встрять ли» (в городе болтают без умолку)
